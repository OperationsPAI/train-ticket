# Load generator configuration (Helm stress-test profile, consumed by the Go
# loadgen in deploy/loadgen-go). Diverges from deploy/k8s/loadgen-config.yaml
# deliberately: zero think time, higher worker/scalper counts.
# Every probability / weight in here is a tunable hyperparameter; the code
# never hardcodes a distribution. Weights need not sum to 1 — they are
# normalized at runtime.

target:
  # In-cluster service DNS. {service} is substituted per call.
  base_url_template: "http://{service}:8080"
  redis_url: "redis://redis:6379"       # backoffice driver only (saga discovery)
  request_timeout_seconds: 10

run:
  # open-loop, not closed-loop. A closed-loop pool cannot have an arrival
  # "shape": its rate is whatever the cluster's response time allows, so the
  # generator slows down exactly when the system struggles -- the opposite of
  # what real users do. Open-loop offers load independently, which is what makes
  # the arrival shaping below mean anything.
  mode: open-loop
  # Still used by the staff/ops/scalper drivers, which remain closed-loop.
  # No longer the thing that sets customer request rate -- target_rps is.
  workers: 50
  duration_seconds: 0         # 0 = run until stopped
  seed: null                  # set an int for reproducible randomness
  # Non-zero now. Zero think time is a saturation-test setting: it makes every
  # virtual customer an infinitely fast robot, which flattens the load and
  # removes the session structure real traffic has. Personas below override this
  # per customer type; this is the fallback for a run with personas removed.
  think_time_seconds: { min: 0.5, max: 3 }
  session_pause_seconds: { min: 1, max: 5 }
  stats_interval_seconds: 30
  state_file: "/data/loadgen-state.json"  # entity registry; "" disables persistence

  # Mean offered rate, in journeys per second, BEFORE the shaping below. Peak
  # rate is this times arrival.diurnal.peak_multiplier, times a burst
  # multiplier if one is active -- so provision for the product, not for this
  # number alone.
  #
  # 20/s was chosen to land the peak near the previously measured throughput
  # (~330 journeys/s across the old flat closed-loop profile was cluster
  # saturation, not a target). The point of this profile is shape, not volume:
  # a generator at saturation has no headroom to express a peak.
  target_rps: 20

  # Arrival shaping. Each shape is independent so a run can isolate one; see
  # deploy/loadgen-go/arrival.go for what each exercises and why.
  #
  #   rate(t) = target_rps * diurnal(t) * burst(t)
  #   gap     ~ Exponential(rate(t))
  arrival:
    # Exponential inter-arrival gaps. This is the shape that changes the
    # CHARACTER of the load rather than its envelope: it takes the per-second
    # coefficient of variation from ~0.13 (fixed-interval metronome, measured on
    # this cluster) to ~1.0. Queues form from variance, not from mean load, so
    # without this a run at 80% utilization produces almost no queueing and
    # cannot exercise backpressure, retry storms or consumer lag.
    poisson: true
    # Ramp from 0 to full rate, so a restarted pod does not hit a cold cluster
    # (empty caches, unwarmed pools) at full rate.
    ramp_seconds: 60

    # Slow peak/trough cycle. The period is deliberately ~30 minutes rather than
    # a wall-clock day: a real 24h cycle looks flat across any window anyone
    # actually watches, and the shape exists to be observed. Peak is 8x trough,
    # which is a realistic weekday spread for a consumer booking system.
    diurnal:
      enabled: true
      period_seconds: 1800
      peak_multiplier: 4.0
      trough_multiplier: 0.5
      # Where in the cycle the run starts; 0 = trough. With >1 loadgen replica,
      # set this per replica to keep them out of phase instead of all peaking
      # together.
      phase_offset: 0.0

    # Short spikes: a ticket release, a push notification, a scalper script
    # waking up. This is the shape most likely to find a real defect, because it
    # moves queue depth faster than any autoscaler can react. Gaps between
    # bursts are themselves exponential -- a predictable spike is one a system
    # can absorb in ways it cannot absorb a surprising one.
    burst:
      enabled: true
      mean_gap_seconds: 420
      duration_seconds: { min: 20, max: 90 }
      multiplier: { min: 3.0, max: 8.0 }

# ---------------------------------------------------------------------------
# Journey mix — relative weights of what a virtual customer does next.
# ---------------------------------------------------------------------------
journey_mix:
  browse: 50        # search (+ maybe quote) and leave — high weight for RPS
  purchase: 20      # full funnel: traveler -> search -> quote -> offer -> order -> pay -> ticket
  refund: 8         # refund one of their own completed purchases
  change: 5         # change case on a completed purchase
  fulfillment: 7    # board + complete (or no-show) with an issued entitlement
  support: 4        # open a support case about one of their orders
  legacy: 6         # whole lifecycle through the legacy ACL facade
  ride: 5           # dispatch ride request lifecycle
  disruption: 1     # low-frequency ops disruption recovery drill
  transfer: 1        # low-frequency transfer-management drill
  loyalty: 8         # check/enroll loyalty membership tier
  insurance: 6       # travel insurance policy request
  group_booking: 5   # create group booking with members
  corporate: 5       # corporate travel agreement
  campaign: 4        # draft marketing campaign (ops-side)

# ---------------------------------------------------------------------------
# Within-journey behavior knobs.
# ---------------------------------------------------------------------------
behavior:
  # identity
  p_new_account: 0.05         # mostly reuse accounts for stress test
  p_new_traveler: 0.10        # mostly reuse travelers for stress test
  p_second_traveler: 0.15     # purchase for two travelers instead of one

  # funnel abandonment (customer walks away without error)
  p_abandon_after_search: 0.20
  p_abandon_after_quote: 0.15
  p_abandon_before_payment: 0.10
  p_cancel_payment_intent_on_abandon: 0.20  # subset explicitly POSTs payment-intents/{id}/cancel
  p_cancel_order_before_payment: 0.10       # subset explicitly POSTs journey-orders/{id}/cancel
  p_refund_get_after_completion: 0.50
  p_payment_channel_missed_seed: 0.01
  p_payment_channel_read_probe: 0.10       # after refund approval, poll payment events and GET refunds/{id}
  p_ancillary_purchase: 0.03                  # small add-on branch in purchase journeys
  p_invoice_after_purchase: 0.02                # small tax e-invoice branch in purchase journeys

  # how long a customer waits for a staff-handled step (reservation,
  # ticketing, risk review) before giving up
  staff_wait_seconds: 60

  # fulfillment variant
  p_no_show: 0.15             # else: board + complete

  # legacy facade
  p_legacy_cancel: 0.30       # cancel after ticket_issue instead of boarding

  # dispatch ride branch probabilities
  ride_branches: { complete: 0.75, driver_cancel_reassign: 0.10, user_cancel: 0.10, no_show: 0.05 }

  # waitlist fallback for purchase journeys that hit NO_AVAILABLE_CAPACITY.
  # Conservative defaults: convert only some sold-out traffic and cancel rarely.
  p_waitlist_on_no_capacity: 0.30
  p_waitlist_cancel: 0.05
  # Which disruption a drill reports. These are raw disruptionType strings from
  # disruption-recovery's DISRUPTION_TYPES set; normalize_disruption_type maps
  # each onto one of the four canonical types, one per key here:
  # SERVICE_DELAY -> DELAY, SERVICE_CANCELLED -> CANCELLATION,
  # STOP_CHANGED -> PARTIAL, WEATHER -> FORCE_MAJEURE. The last two of those
  # canonical types also run the mass-disruption batch path unconditionally, so
  # their share sets how often that path is exercised.
  disruption_type_mix: { SERVICE_DELAY: 0.55, SERVICE_CANCELLED: 0.25, STOP_CHANGED: 0.15, WEATHER: 0.05 }

  # Which recovery option the customer picks. These four are exactly the option
  # set the server builds for every case this drill gets a choice on, for all
  # four canonical disruption types alike, so one flat mix is right rather than a
  # per-type mix. MANUAL is offered on every such case. REACCOMMODATION must NOT
  # be added: build_option_set offers it only for a MISSED_CONNECTION reported by
  # TRANSFER_MANAGEMENT as a SYSTEM actor, which this drill is not, and a
  # configured option the server cannot offer now fails the journey loudly rather
  # than silently substituting another.
  disruption_option_mix: { WAIT: 0.40, REFUND: 0.30, COMPENSATION: 0.20, MANUAL: 0.10 }

  # All four of transfer-management's ContractType values. The behavior they
  # change is binary: PROTECTED and SUPPLIER_PROTECTED are the service's
  # PROTECTED_TYPES, so a missed connection auto-rebooks and opens a recovery
  # case, while SELF_TRANSFER and PLATFORM_ASSISTED do neither and differ from
  # each other only as a stored label.
  transfer_contract_mix: { PROTECTED: 0.40, SUPPLIER_PROTECTED: 0.20, SELF_TRANSFER: 0.25, PLATFORM_ASSISTED: 0.15 }
  p_transfer_delay: 0.35
  p_transfer_missed: 0.25
  waitlist_deadline_minutes: 30

  # What the refund journey asks post-sales for. CHANGE is the change journey's
  # own type. REBOOK is absent deliberately: post-sales maps a REBOOK case to a
  # REFUND decision kind and then requires the kind to match the case type, so
  # every REBOOK evaluates to a 422 no request shape can avoid.
  post_sales_case_mix: { REFUND: 0.62, CANCELLATION: 0.28, COMPENSATION: 0.10 }

  # Sales channel weights, sent on the search, the fare quote and the offer.
  # No service enumerates this string; the constraint is that fare-pricing
  # quotes only for a channel with a published rule set, and api.py seeds
  # WEB / web / MOBILE / COUNTER. Verified on the resident deployment: all three
  # below quote 201. "web" is omitted as a casing duplicate of WEB.
  channels: { WEB: 0.62, MOBILE: 0.30, COUNTER: 0.08 }

  # Support-case channel, a DIFFERENT enumeration from channels above and
  # therefore its own knob. customer-service enforces a closed code-level enum
  # (APP, WEB, PHONE, IM, EMAIL, IN_APP_MESSAGE, BOT, OPERATOR_CONSOLE) in which
  # WEB is the only member shared with the sales channels; MOBILE and COUNTER
  # return 400 there.
  support_channels: { APP: 0.45, WEB: 0.25, PHONE: 0.12, IM: 0.10, EMAIL: 0.05, IN_APP_MESSAGE: 0.03 }

  # legacy seat types
  seat_types: { SECOND: 0.8, FIRST: 0.2 }

  # traveler identity pools used when creating (mock) travelers. All six values
  # of traveler-profile's TravelerType, which is enforced on create and update.
  # No service the loadgen drives branches on the type -- post-sales' student
  # refund tier reads the journey-order traveler ref, which journey-order writes
  # as ADULT for every traveler -- so INFANT is seated and quoted like an ADULT
  # and its share manufactures no refusals.
  traveler_types: { ADULT: 0.62, STUDENT: 0.14, CHILD: 0.09, SENIOR: 0.09, INFANT: 0.03, MILITARY: 0.03 }

# ---------------------------------------------------------------------------
# Staff simulator — the platform/agent actor pool (simulated like customers).
# Staff process queues: saga reservation driving, ticket issuing, manual
# risk review, support case handling.
# ---------------------------------------------------------------------------
staff:
  workers: 60
  think_time_seconds: { min: 0, max: 0 }        # zero think time for stress test
  queue_poll_seconds: 0.1
  p_risk_approve: 0.50        # manual review lifts the block, else rejected
  p_support_assign: 0.80
  p_support_resolve: 0.60
  p_support_assign_resolve_branch: 0.70     # existing assign/resolve path
  p_support_classify_escalate_branch: 0.15  # classify -> assign -> escalate lifecycle coverage
  p_support_classify_close_branch: 0.15     # classify -> close, optionally reopen -> close
  p_support_reopen_after_close: 0.10        # only after the classify/close branch
  p_seat_preferences: 0.03    # staff ticketing attaches a seatPreferences block

# ---------------------------------------------------------------------------
# Long-tail probes — conservative low-frequency coverage for read endpoints.
# Reads are attached to real entities just produced by normal journeys; ID
# mismatches are counted in errors. Disable with enabled: false.
# ---------------------------------------------------------------------------
long_tail:
  enabled: true
  p_read_probe_after_journey: 0.05
  p_ancillary_read_probe: 0.20

# ---------------------------------------------------------------------------
# Operations-side actor — runs every few minutes and drives read-only reporting
# and finance queries plus very low-frequency supplier-catalog master-data writes.
# Idempotency keys are generated per command by the API client (UUIDv7).
# ---------------------------------------------------------------------------
ops:
  enabled: true
  interval_seconds: { min: 180, max: 420 }
  dashboard_id: dash-revenue
  p_supplier_catalog_write: 0.25
  p_wallet_manual_issue: 0.20
  wallet_manual_issue_minor_units: 100

# ---------------------------------------------------------------------------
# Bootstrap — ops-side inventory guarantees (NOT customer actions). Runs once
# at startup; idempotent. Ensures searches can actually find trips.
# ---------------------------------------------------------------------------
bootstrap:
  enabled: true
  # Which lines of the route topology to create inventory on. A place and a
  # transport node are created per station of these lines, only if a place with
  # the same code is not already registered (discovered via the list API).
  #
  # The stations themselves -- their order along each line and their real
  # kilometre positions -- are a Go table in deploy/loadgen-go/topology.go, not
  # config. They are consumed twice, by bootstrap to create inventory and by the
  # persona demand model to pick trips, and a list duplicated across config and
  # code would drift. Only the SELECTION is a deployment choice.
  #
  # All four: the lines intersect at Shanghai Hongqiao, Changsha South and
  # Hangzhou East, and those shared stations are what make the corpus of
  # plausible journeys a network rather than four separate corridors.
  lines:
    - beijing-shanghai      # 16 stops, 1318 km, via Tianjin/Jinan/Nanjing/Suzhou
    - beijing-guangzhou     # 16 stops, 2298 km, via Shijiazhuang/Zhengzhou/Wuhan/Changsha
    - shanghai-kunming      # 18 stops, 2252 km, via Hangzhou/Nanchang/Changsha/Guiyang
    - hangzhou-shenzhen     # 15 stops, 1381 km, via Ningbo/Wenzhou/Fuzhou/Xiamen
  # Rolling departure window: services are ensured for each day in
  # [T+from_days, T+to_days] (computed at startup from today's date).
  # For backward compat, if departure_dates is present it takes precedence.
  #
  # This is now only the INVENTORY window and the fallback booking window. What
  # each persona actually books is booking_lead_days below, which must stay
  # inside this range or that persona finds no inventory on its dates.
  departure_window:
    from_days: 1      # T+1  -- a business traveller books for tomorrow
    to_days: 45       # T+45 -- a casual traveller books six weeks out
  # Station pairs per date, divided across the active lines and spread over each
  # line's distance spectrum, so every persona's distance band has inventory.
  services_per_date: 24
  service_number_base: 5000    # G<base+n> to avoid clashing with e2e's G1234

# ---------------------------------------------------------------------------
# Default monetary / domain values — read by journey providers so nothing
# is hardcoded in the loadgen source.
# ---------------------------------------------------------------------------
defaults:
  currency: "CNY"
  insurance_premium_minor: 50000
  group_fare_minor: 85000
  group_discount_basis_points: 500
  corporate_credit_limit_minor: 5000000

# ---------------------------------------------------------------------------
# Scalper simulator — ticket scalper (黄牛) actor. Zero think time, multi-
# account pool rotation, retry-storm on failure, hot-segment targeting.
# ---------------------------------------------------------------------------
scalper:
  enabled: true
  workers: 16                  # concurrent scalper workers
  accounts_per_worker: 10      # pre-registered account pool per worker
  target_segments: 15          # grab from the first N bootstrap segments
  retry_on_failure: 0.8        # probability of immediate retry on step failure
  retry_same_key: true         # reuse the same Idempotency-Key on retry
  purchase_batch_size: 4       # attempts per tight loop before micro-pause

# Poll tuning for asynchronous state (saga completion, order confirmation).
polling:
  attempts: 10
  interval_seconds: 1

wallet_promotion:
  p_purchase_reserve_redeem: 0.02
  purchase_benefit_minor_units: 100

waitlist:
  poll_attempts: 8
  poll_interval_seconds: 4

# ---------------------------------------------------------------------------
# Per-request outcome records (issue #420). One JSON Lines row per client HTTP
# request, carrying the trace id so each row can be joined to its server-side
# spans in Jaeger. The aggregate `[stats]` snapshot is unchanged; this is
# additional output.
#
# Feature parity with deploy/k8s/loadgen-config.yaml: the Go loadgen defaults
# recording.enabled to FALSE, so omitting this section silently produced no
# record file at all under Helm -- which matters more here than in kind, since
# this profile is the stress-test one. The tuning values above are deliberately
# divergent from kustomize; these are not.
#
# The path MUST live under the /data volume mounted by templates/loadgen.yaml --
# anywhere else and the file dies with the container's writable layer. /data is
# an emptyDir, so it survives container restarts but not pod deletion.
#
# Load-neutral by construction: request goroutines only do a non-blocking send
# onto a buffered channel; all encoding and file IO happens on one writer
# goroutine, so disk latency cannot back-pressure into the offered RPS.
# ---------------------------------------------------------------------------
recording:
  enabled: true
  path: /data/requests.jsonl   # must be under the /data volume (loadgen.yaml)
  buffer_records: 65536        # hand-off channel depth; full => drop + count
  flush_interval_seconds: 2    # bounds how stale the on-disk tail can be
  max_file_megabytes: 512      # at the cap, rename to <path>.1 and start fresh
  # The loadgen ORIGINATES these traces, so it owns the sampling decision. With
  # flags=00 a conformant service records no span and the recorded trace id
  # would point at nothing in Jaeger. Lower only to shed backend volume.
  trace_sampled_ratio: 1.0

# ---------------------------------------------------------------------------
# Personas — probability overlays on top of global behavior.  Each worker
# iteration picks a persona based on weight, then merges its overrides into
# the active behavior context.  No persona-specific code paths — behavior
# differences come purely from probability values.  Omit this section (or
# leave empty) for backward compat: the global behavior + journey_mix act
# as a single implicit persona.
#
# ENABLED for realism. Without personas every virtual customer is statistically
# identical, so the request MIX is as flat as the request RATE was: one abandon
# probability, one think time, one journey distribution. Real populations are
# mixtures, and the mixture is what produces a realistic spread of session
# lengths and conversion rates.
#
# Note what this does and does not do: personas change WHO is requesting (mix,
# think time, abandon rate), while run.arrival changes WHEN requests arrive.
# Enabling personas alone would not have fixed the flat rate -- the two are
# independent, and both are needed.
# ---------------------------------------------------------------------------
personas:
  # Majority browser: high abandon rate, long think time, rarely buys. This is
  # what makes the read path dominate the write path, as it does in production.
  #
  # Travels long, books far ahead, and is the one persona that mostly travels at
  # a weekend. A leisure trip: the whole Beijing-Shanghai run rather than a hop
  # along it, planned weeks out, departing on a Saturday.
  casual:
    weight: 60
    journey_weights: {browse: 40, purchase: 30, refund: 8, support: 4, loyalty: 5, insurance: 3}
    overrides:
      p_new_account: 0.35
      p_abandon_after_search: 0.30
      think_time: {min: 2, max: 8}
      trip_distance_km: {short: 0.05, medium: 0.20, long: 0.45, epic: 0.30}
      booking_lead_days: {min: 14, max: 45}
      p_weekend_departure: 0.65
      p_repeat_trip: 0.02
      # Spread over the whole network, with a lean towards the scenic
      # north-south lines rather than the business trunk.
      line_weights:
        beijing-shanghai: 20
        beijing-guangzhou: 25
        shanghai-kunming: 30
        hangzhou-shenzhen: 25
  # Buys with intent: short think time, low abandon, change-heavy.
  #
  # Short intercity hops on the trunk lines, repeatedly, booked close to
  # departure and almost never at a weekend. Beijing to Tianjin on Tuesday
  # morning, booked Monday night, and again next week.
  business:
    weight: 25
    journey_weights: {purchase: 50, change: 15, corporate: 10, loyalty: 10}
    overrides:
      p_new_account: 0.10
      p_abandon_after_search: 0.05
      think_time: {min: 0.5, max: 2}
      trip_distance_km: {short: 0.60, medium: 0.32, long: 0.08, epic: 0.0}
      booking_lead_days: {min: 1, max: 5}
      p_weekend_departure: 0.05
      # The knob that makes this persona's demand concentrated rather than
      # merely short: most of its trips repeat a hop it has already taken.
      p_repeat_trip: 0.55
      # The two trunk lines, where the intercity hops are.
      line_weights:
        beijing-shanghai: 55
        beijing-guangzhou: 35
        shanghai-kunming: 7
        hangzhou-shenzhen: 3
  # Never abandons and exercises the widest set of journeys, including the
  # post-purchase paths (fulfillment, ride) the other two rarely reach.
  #
  # Books across the whole distance and lead-time spectrum, so this persona is
  # the one that keeps the middle of both ranges populated.
  power_user:
    weight: 15
    journey_weights: {purchase: 40, browse: 20, refund: 10, change: 10, fulfillment: 10, ride: 10}
    overrides:
      p_new_account: 0.05
      p_abandon_after_search: 0.0
      think_time: {min: 0.3, max: 1.5}
      trip_distance_km: {short: 0.25, medium: 0.35, long: 0.25, epic: 0.15}
      booking_lead_days: {min: 3, max: 30}
      p_weekend_departure: 0.30
      p_repeat_trip: 0.20
      line_weights:
        beijing-shanghai: 30
        beijing-guangzhou: 25
        shanghai-kunming: 25
        hangzhou-shenzhen: 20
