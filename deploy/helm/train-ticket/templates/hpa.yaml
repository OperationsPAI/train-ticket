{{- $defaults := .Values.defaults | default dict }}
{{- range $name, $svc := .Values.services }}
{{- $autoscaling := $svc.autoscaling | default dict }}
{{- if ($autoscaling.enabled | default false) }}
{{- $minReplicas := required (printf "services.%s.autoscaling.minReplicas is required when autoscaling is enabled" $name) $autoscaling.minReplicas }}
{{- $maxReplicas := required (printf "services.%s.autoscaling.maxReplicas is required when autoscaling is enabled" $name) $autoscaling.maxReplicas }}
{{- $cpuTarget := required (printf "services.%s.autoscaling.targetCPUUtilizationPercentage is required when autoscaling is enabled" $name) $autoscaling.targetCPUUtilizationPercentage }}
{{- $memoryTargetSet := hasKey $autoscaling "targetMemoryUtilizationPercentage" }}
{{- $memoryTarget := $autoscaling.targetMemoryUtilizationPercentage | default 0 }}
{{- $resources := $svc.resources | default $defaults.resources | default dict }}
{{- $requests := $resources.requests | default dict }}
{{- if lt (int $minReplicas) 1 }}
{{- fail (printf "services.%s.autoscaling.minReplicas must be at least 1" $name) }}
{{- end }}
{{- if lt (int $maxReplicas) (int $minReplicas) }}
{{- fail (printf "services.%s.autoscaling.maxReplicas must be greater than or equal to minReplicas" $name) }}
{{- end }}
{{- if lt (int $cpuTarget) 1 }}
{{- fail (printf "services.%s.autoscaling.targetCPUUtilizationPercentage must be at least 1" $name) }}
{{- end }}
{{- if not (hasKey $requests "cpu") }}
{{- fail (printf "services.%s requires resources.requests.cpu when autoscaling is enabled" $name) }}
{{- end }}
{{- if $memoryTargetSet }}
{{- if lt (int $memoryTarget) 1 }}
{{- fail (printf "services.%s.autoscaling.targetMemoryUtilizationPercentage must be at least 1" $name) }}
{{- end }}
{{- if not (hasKey $requests "memory") }}
{{- fail (printf "services.%s requires resources.requests.memory when memory autoscaling is enabled" $name) }}
{{- end }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: train-ticket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ int $minReplicas }}
  maxReplicas: {{ int $maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ int $cpuTarget }}
    {{- if $memoryTargetSet }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ int $memoryTarget }}
    {{- end }}
  {{- with $autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
