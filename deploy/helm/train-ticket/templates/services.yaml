{{- $defaults := .Values.defaults | default dict }}
{{- $defaultProbes := $defaults.probes | default dict }}
{{- range $name, $svc := .Values.services }}
{{- $db := $svc.db | default "" }}
{{- $replicas := $svc.replicas | default 1 }}
{{- $probes := $svc.probes | default dict }}
{{- /*
`| default` treats false as empty, so a per-service `probes.startup: false`
would be silently overridden by the true default. hasKey is the only way to
distinguish "explicitly disabled" from "not set" for a boolean.
*/}}
{{- $startup := ternary $probes.startup ($defaultProbes.startup | default false) (hasKey $probes "startup") }}
{{- $startupThreshold := $probes.startupFailureThreshold | default $defaultProbes.startupFailureThreshold | default 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: train-ticket
    spec:
      {{- if $db }}
      {{- $pgHost := printf "postgres-%s" ($svc.pgInstance | default $.Values.postgres.defaultInstance) }}
      initContainers:
        - name: wait-postgres
          image: {{ include "train-ticket.infraImage" (dict "global" $.Values.global "repo" "busybox" "tag" "1.37") }}
          command: ['sh', '-c', 'until nc -z {{ $pgHost }} 5432; do echo "waiting for {{ $pgHost }}..."; sleep 2; done']
        - name: wait-redis
          image: {{ include "train-ticket.infraImage" (dict "global" $.Values.global "repo" "busybox" "tag" "1.37") }}
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done']
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "train-ticket.image" (dict "global" $.Values.global "name" $name) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_URL
              value: redis://redis.{{ $.Release.Namespace }}.svc.cluster.local:6379
            {{- if $db }}
            {{- $pgHost := $svc.pgInstance | default $.Values.postgres.defaultInstance }}
            - name: DATABASE_URL
              value: postgresql://{{ $.Values.postgres.credentials.username }}:{{ $.Values.postgres.credentials.password }}@postgres-{{ $pgHost }}:5432/{{ $db }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            {{- /*
            Log/trace correlation. platform/java-kit's TraceLoggingContext binds
            trace_id and span_id into the SLF4J MDC, but nothing prints MDC entries
            by default, so without this the ids exist and are invisible.

            Set as an environment variable rather than from inside the kit: an
            EnvironmentPostProcessor was tried first and does not work. Boot
            resolves its own default for this key at a higher precedence than
            either a last-placed property source or `defaultProperties`, so the
            pattern was silently ignored -- verified three times by running the
            built image and finding no trace field. An env var wins outright.

            Harmless for the non-Java services, which ignore it.
            */}}
            - name: LOGGING_PATTERN_CORRELATION
              value: "[trace=%X{trace_id:-} span=%X{span_id:-}] "
            {{- range $k, $v := $defaults.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $defaults.resources | default dict) | nindent 12 }}
          {{- /*
          Probe paths are /healthz and /readyz and are NOT interchangeable
          with /health and /ready.

          Liveness must hit /healthz: in the TypeScript services /health always
          answers 200 while /healthz is bound to the grace-period liveness
          tracker (platform/ts-kit/src/liveness.ts), which is the whole point of
          that module -- a probe on /health cannot restart a wedged process.
          Readiness must hit /readyz for the same reason on the Rust side, where
          /readyz carries the dependency check (e.g.
          services/invoicing/src/lib.rs postgres_ready_handler).

          Conversely, liveness must NOT be pointed at /readyz: that turns a slow
          Postgres into a kubelet restart loop. Slow starts are absorbed by the
          startupProbe, which holds liveness off; that is why kustomize gave
          invoicing one, and services.<name>.probes.startup lets any service
          opt in or out here.
          */}}
          {{- if $startup }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: {{ $startupThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
