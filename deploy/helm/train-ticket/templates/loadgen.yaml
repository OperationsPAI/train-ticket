{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: train-ticket
    spec:
      initContainers:
        - name: wait-postgres
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" "busybox" "tag" "1.37") }}
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done']
        - name: wait-redis
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" "busybox" "tag" "1.37") }}
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done']
        - name: wait-core-services
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" "busybox" "tag" "1.37") }}
          command:
            - sh
            - -c
            - |
              echo "waiting for core services..."
              for svc in account trip-planning journey-order offer-management fare-pricing payment; do
                until nc -z $svc 8080; do echo "  waiting for $svc..."; sleep 3; done
                echo "  $svc ready"
              done
              echo "all core services ready"
      containers:
        - name: loadgen
          image: {{ include "train-ticket.image" (dict "global" .Values.global "name" "loadgen") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: state
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: loadgen-config
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-config
data:
  {{- (.Files.Glob "loadgen-config.yaml").AsConfig | nindent 2 }}
{{- end }}
