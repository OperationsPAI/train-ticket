{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: {{ .Values.loadgen.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: train-ticket
    spec:
      initContainers:
        - name: wait-infra
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" "busybox" "tag" "1.37") }}
          command:
            - sh
            - -c
            - |
              echo "waiting for postgres..."
              until nc -z postgres 5432; do sleep 2; done
              echo "waiting for redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "infra ready — loadgen will retry service connections internally"
      containers:
        - name: loadgen
          image: {{ include "train-ticket.image" (dict "global" .Values.global "name" "loadgen") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: state
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: loadgen-config
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-config
data:
  {{- (.Files.Glob "loadgen-config.yaml").AsConfig | nindent 2 }}
{{- end }}
