{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: redis
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.redis.image.repository "tag" .Values.redis.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6379
          args:
            - "--maxmemory"
            - {{ .Values.redis.maxmemory | default "6gb" | quote }}
            - "--maxmemory-policy"
            - {{ .Values.redis.maxmemoryPolicy | default "allkeys-lru" | quote }}
            - "--save"
            - ""
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: {{ (.Values.redis.resources).requests.cpu | default "500m" | quote }}
              memory: {{ (.Values.redis.resources).requests.memory | default "1Gi" }}
            limits:
              cpu: {{ (.Values.redis.resources).limits.cpu | default "4" | quote }}
              memory: {{ (.Values.redis.resources).limits.memory | default "8Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
