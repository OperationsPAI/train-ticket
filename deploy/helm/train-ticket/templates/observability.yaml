{{- if .Values.otelCollector.enabled }}
{{- /*
Telemetry ingest. Three collectors, one durable store (templates/clickhouse.yaml).

  otel-collector  Deployment  OTLP gateway. Every instrumented service sends
                              here (OTEL_EXPORTER_OTLP_ENDPOINT in
                              templates/services.yaml). Name and port 4317 are
                              part of the service contract -- see
                              docs/07-observability/README.md.
  otel-agent      DaemonSet   Per-node signals that can only be read locally:
                              pod logs off the node filesystem, kubelet stats,
                              host metrics.
  otel-cluster    Deployment  Cluster-scoped signals that must be collected
                              exactly once: k8s object state, k8s events, and
                              the Prometheus federation pull.

The split is by what a receiver can physically see, not by preference. filelog
must run on every node because /var/log/pods is node-local; k8s_cluster must run
once because N replicas would emit N copies of the same cluster state.

This replaces a Jaeger/Badger trace store that retained traces only, and sent
metrics and logs to `debug` (the collector's stdout, which is not queryable).
The rationale for the swap is in docs/07-observability/README.md.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
data:
  # Mirrors platform/observability/otel-collector.yaml, the canonical collector
  # config for local compose and kind. Keep the two synchronized; the tunable
  # numbers here come from .Values.otelCollector.
  otel-collector.yaml: |
    {{- include "train-ticket.gatewayConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      annotations:
        # kustomize gets this for free from configMapGenerator's name hash.
        # Hashes the rendered config itself, so ANY change that reaches the
        # collector -- a value or the template body -- rolls the pod.
        checksum/config: {{ include "train-ticket.gatewayConfig" . | sha256sum }}
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: train-ticket
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.otelCollector.image.repository "tag" .Values.otelCollector.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config=/etc/otelcol-contrib/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: zpages
              containerPort: 55679
            - name: metrics
              containerPort: 8888
          {{- with .Values.otelCollector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health
      port: 13133
      targetPort: health
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: zpages
      port: 55679
      targetPort: zpages
  selector:
    app.kubernetes.io/name: otel-collector
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: mailpit
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.mailpit.image.repository "tag" .Values.mailpit.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          {{- with .Values.mailpit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
  selector:
    app.kubernetes.io/name: mailpit
{{- end }}
