{{- if .Values.jaeger.enabled }}
{{- /*
Trace store: Jaeger all-in-one backed by Badger on a PersistentVolumeClaim.

Ported from the retired kustomize overlay's jaeger.yaml (the kind overlay) and
platform/observability/docker-compose.yaml. Rationale and the capacity
arithmetic behind the PVC size and the TTL live in
docs/07-observability/README.md.

Two invariants this template must preserve (docs/07-observability/README.md
"Rules"):
  1. replicas stays 1 and strategy stays Recreate. Badger takes an exclusive
     LOCK on its directory; a RollingUpdate would start a second pod against
     the same ReadWriteOnce volume and it would crash-loop until the old pod
     terminated. Neither is exposed as a value, on purpose.
  2. jaeger.resources.limits.memory stays well above 576Mi. Badger allocates a
     256MiB block cache plus up to 5 x 64MiB memtables before storing a single
     span, so the previous 256Mi limit could not hold the store at all.
Sizing and retention are tunable per environment (jaeger.storage.size /
jaeger.retention.spanStoreTtl); they must be changed together.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: train-ticket
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.jaeger.storage.storageClass }}
  storageClassName: {{ .Values.jaeger.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.jaeger.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  strategy:
    # Required: Badger holds an exclusive directory lock, and the PVC is RWO.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: train-ticket
    spec:
      securityContext:
        # The jaeger image runs as uid 10001 / gid 0. fsGroup makes the mounted
        # volume group-writable for that process on clusters whose provisioner
        # does not already create the directory world-writable. OnRootMismatch
        # keeps startup fast once the store has grown.
        fsGroup: {{ .Values.jaeger.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jaeger
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.jaeger.image.repository "tag" .Values.jaeger.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --badger.ephemeral=false
            - --badger.directory-key=/badger/keys
            - --badger.directory-value=/badger/values
            # Retention window. Spans older than this are dropped by Badger's
            # maintenance thread. Raising it without growing jaeger.storage.size
            # moves the binding limit from the TTL to the disk -- see the
            # scaling table in docs/07-observability/README.md.
            - --badger.span-store-ttl={{ .Values.jaeger.retention.spanStoreTtl }}
            - --badger.maintenance-interval={{ .Values.jaeger.retention.maintenanceInterval }}
          env:
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Make the Go runtime collect before the cgroup limit is reached
            # instead of being OOM-killed by the kubelet. Keep at ~85% of
            # jaeger.resources.limits.memory.
            - name: GOMEMLIMIT
              value: {{ .Values.jaeger.gomemlimit | quote }}
          ports:
            - name: jaeger-otlp
              containerPort: 4317
            - name: ui
              containerPort: 16686
          volumeMounts:
            - name: badger
              mountPath: /badger
          {{- with .Values.jaeger.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            # Badger replays its write-ahead log on start; on a full store that
            # can outlast a short liveness delay. Gate liveness behind this.
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: badger
          persistentVolumeClaim:
            claimName: jaeger-badger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: jaeger-otlp
      port: 4317
      targetPort: jaeger-otlp
    - name: ui
      port: 16686
      targetPort: ui
  selector:
    app.kubernetes.io/name: jaeger
{{- end }}
{{- if .Values.otelCollector.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
data:
  # Mirrors platform/observability/otel-collector.yaml, the canonical collector
  # config for local compose and kind. Keep the two synchronized; the tunable
  # numbers here come from .Values.otelCollector.
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        # Must stay above the sending_queue below: a limiter smaller than the
        # queue makes the collector refuse spans it could buffer. Keep below
        # otelCollector.resources.limits.memory.
        limit_mib: {{ .Values.otelCollector.memoryLimitMiB }}
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      debug:
        verbosity: basic
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
        # The trace store is a stateful, restartable component: it holds an
        # exclusive lock on its Badger volume, so a restart takes it offline
        # for a few seconds. Retry plus a bounded queue means spans emitted
        # during that window are redelivered instead of dropped on the floor.
        # The queue is in memory, so this covers a store restart, not a
        # *collector* restart.
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: {{ .Values.otelCollector.sendingQueue.numConsumers }}
          queue_size: {{ .Values.otelCollector.sendingQueue.queueSize }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      telemetry:
        logs:
          level: info
      extensions:
        - health_check
        - zpages
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
            - otlp/jaeger
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      annotations:
        # kustomize gets this for free from configMapGenerator's name hash.
        # Without it, `helm upgrade` after changing a collector tunable leaves
        # the running collector on the old config until someone restarts it by
        # hand. Hashes the values that feed the ConfigMap above (hashing the
        # rendered template itself would recurse through this annotation).
        checksum/config: {{ .Values.otelCollector | toYaml | sha256sum }}
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: otel-collector
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.otelCollector.image.repository "tag" .Values.otelCollector.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config=/etc/otelcol-contrib/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: zpages
              containerPort: 55679
            - name: metrics
              containerPort: 8888
          {{- with .Values.otelCollector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health
      port: 13133
      targetPort: health
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: zpages
      port: 55679
      targetPort: zpages
  selector:
    app.kubernetes.io/name: otel-collector
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: mailpit
          image: {{ include "train-ticket.infraImage" (dict "global" .Values.global "repo" .Values.mailpit.image.repository "tag" .Values.mailpit.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          {{- with .Values.mailpit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
  selector:
    app.kubernetes.io/name: mailpit
{{- end }}
