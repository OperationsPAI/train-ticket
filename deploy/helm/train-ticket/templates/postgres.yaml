{{- if .Values.postgres.enabled }}
{{- range $name, $pg := .Values.postgres.instances }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-{{ $name }}-credentials
type: Opaque
stringData:
  POSTGRES_USER: {{ $.Values.postgres.credentials.username }}
  POSTGRES_PASSWORD: {{ $.Values.postgres.credentials.password }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-{{ $name }}-initdb
data:
  # NOTE: /docker-entrypoint-initdb.d scripts are executed by the postgres image
  # ONLY when PGDATA is empty (a FRESH data directory). This Deployment mounts a
  # PersistentVolumeClaim, so on any cluster where this shard has already
  # initialised, changing postgres.instances.<shard>.databases has NO effect on
  # `helm upgrade` -- the new databases must be created by hand:
  #   kubectl exec -n <ns> deploy/postgres-{{ $name }} -- \
  #     psql -U trainticket -d postgres -c 'CREATE DATABASE group_booking'
  # Keep the union of all shards' databases in sync with services.<name>.db
  # (38 services -> 38 databases).
  init-databases.sh: |
    #!/bin/bash
    set -e
    {{- range $pg.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
      SELECT 'CREATE DATABASE {{ . }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
      GRANT ALL PRIVILEGES ON DATABASE {{ . }} TO $POSTGRES_USER;
    SQL
    {{- end }}
    # Ensure remote connections are allowed (needed for pod-to-pod traffic)
    if ! grep -q '0.0.0.0/0' "$PGDATA/pg_hba.conf" 2>/dev/null; then
      echo "host all all 0.0.0.0/0 md5" >> "$PGDATA/pg_hba.conf"
      pg_ctl reload -D "$PGDATA" 2>/dev/null || true
    fi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-{{ $name }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $.Values.postgres.storage.storageClass }}
  storageClassName: {{ $.Values.postgres.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.postgres.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-{{ $name }}
  labels:
    app.kubernetes.io/name: postgres-{{ $name }}
    app.kubernetes.io/part-of: train-ticket
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-{{ $name }}
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: postgres
          image: {{ include "train-ticket.infraImage" (dict "global" $.Values.global "repo" $.Values.postgres.image.repository "tag" $.Values.postgres.image.tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ $name }}-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ $name }}-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args: ["-c", "max_connections={{ $pg.maxConnections | default 300 }}", "-c", "shared_buffers={{ $pg.sharedBuffers | default "256MB" }}", "-c", "work_mem={{ $pg.workMem | default "8MB" }}", "-c", "max_slot_wal_keep_size=2GB"]
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-{{ $name }}-data
        - name: initdb
          configMap:
            name: postgres-{{ $name }}-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: postgres-{{ $name }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
{{/*
Backward-compat: a bare "postgres" name resolves to the default shard, which is
the one services with no explicit pgInstance are pointed at. Must be an
explicitly configured shard name, not `keys ... | first` -- Helm's `keys` does
not guarantee order, so that produced a different alias on every render and
`helm upgrade` churned the Service. Fails the render loudly if the named shard
does not exist.
*/}}
{{- $defaultInstance := .Values.postgres.defaultInstance }}
{{- if not (hasKey .Values.postgres.instances $defaultInstance) }}
{{- fail (printf "postgres.defaultInstance=%q is not a key of postgres.instances (%v)" $defaultInstance (keys .Values.postgres.instances | sortAlpha)) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ExternalName
  externalName: postgres-{{ $defaultInstance }}.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
