{{- range $name, $pg := .Values.postgres.instances }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-{{ $name }}-credentials
type: Opaque
stringData:
  POSTGRES_USER: {{ $.Values.postgres.credentials.username }}
  POSTGRES_PASSWORD: {{ $.Values.postgres.credentials.password }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-{{ $name }}-initdb
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    {{- range $pg.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
      SELECT 'CREATE DATABASE {{ . }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
      GRANT ALL PRIVILEGES ON DATABASE {{ . }} TO $POSTGRES_USER;
    SQL
    {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-{{ $name }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $.Values.postgres.storage.storageClass }}
  storageClassName: {{ $.Values.postgres.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.postgres.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-{{ $name }}
  labels:
    app.kubernetes.io/name: postgres-{{ $name }}
    app.kubernetes.io/part-of: train-ticket
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-{{ $name }}
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: postgres
          image: {{ include "train-ticket.infraImage" (dict "global" $.Values.global "repo" $.Values.postgres.image.repository "tag" $.Values.postgres.image.tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ $name }}-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-{{ $name }}-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args: ["-c", "max_connections={{ $pg.maxConnections | default 300 }}", "-c", "shared_buffers={{ $pg.sharedBuffers | default "256MB" }}", "-c", "work_mem={{ $pg.workMem | default "8MB" }}", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ $.Values.postgres.credentials.username }}"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-{{ $name }}-data
        - name: initdb
          configMap:
            name: postgres-{{ $name }}-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: postgres-{{ $name }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
{{/* Backward-compat: "postgres" service points to the default shard */}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ExternalName
  externalName: postgres-{{ (keys .Values.postgres.instances | first) }}.{{ .Release.Namespace }}.svc.cluster.local
