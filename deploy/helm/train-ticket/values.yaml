global:
  imageRegistry: ""  # e.g. "pair-cn-guangzhou.cr.volces.com" for mirror
  imageOrg: "opspai"
  imageTag: "latest"
  imagePullPolicy: IfNotPresent

# -- Infrastructure ----------------------------------------------------------

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 20Gi
    storageClass: ""  # empty = default StorageClass
  credentials:
    username: trainticket
    password: trainticket-dev
  # Shard that the bare `postgres` ExternalName alias points at, and the shard
  # used by every service that does not set its own `pgInstance`. Must be a key
  # of `postgres.instances` below; the template fails the render if it is not.
  defaultInstance: core
  # Postgres shards. The default profile is a single shard (`core`) holding all
  # 38 databases, which is what a local kind node wants: one Deployment, one
  # PVC, one connection ceiling to reason about.
  # values-prod.yaml splits these across 6 shards.
  #
  # The union of all shards' `databases` MUST cover every `services.<name>.db`
  # below -- a missing entry means the service starts, connects, and fails on
  # its first query. See the initdb caveat in templates/postgres.yaml: on an
  # already-initialised volume, adding a name here has no effect until the
  # database is created by hand.
  instances:
    core:
      databases:
        - account
        - admin_audit
        - ancillary_service
        - booking_orchestration
        - capacity_availability
        - corporate_travel
        - customer_service
        - dispatch
        - disruption_recovery
        - entitlement_ticketing
        - fare_pricing
        - finance_settlement
        - fulfillment
        - group_booking
        - identity_verification
        - invoicing
        - journey_order
        - legacy_acl
        - loyalty_membership
        - marketing_campaign
        - notification
        - offer_management
        - payment
        - payment_channel
        - place_network
        - post_sales
        - provider_integration
        - reporting
        - risk_compliance
        - seat_assignment
        - service_plan
        - supplier_catalog
        - transfer_management
        - travel_insurance
        - traveler_profile
        - trip_planning
        - waitlist
        - wallet_promotion
      # Sized with real headroom rather than "just enough not to OOM". The node
      # this runs on has ~62Gi and only a few cores committed, so being frugal
      # here buys nothing and has already cost two outages: Postgres was
      # OOMKilled twice at a 512Mi limit, and a later attempt to trim
      # max_connections to 250 -- sized against a 180-connection observation
      # taken while the loadgen was still warming up -- was blown past during a
      # rolling restart, when old and new pods hold their pools concurrently.
      # Postgres then refused with "sorry, too many clients already", which
      # broke transactions mid-flight and silently stopped identity-verification
      # from publishing its outbox events.
      #
      # 500 connections at 8MB work_mem is the sizing constraint; shared_buffers
      # stays at the conventional ~25% of the limit.
      maxConnections: 500
      sharedBuffers: 1GB
      workMem: 8MB
      resources:
        requests: { cpu: 250m, memory: 1Gi }
        limits: { cpu: '4', memory: 4Gi }

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  # maxmemory must stay BELOW resources.limits.memory so Redis enforces its own
  # bound rather than being OOMKilled by the cgroup -- the ~75% ratio below
  # covers allocator fragmentation and client output buffers, which maxmemory
  # (a logical-dataset bound) does not account for. Policy stays noeviction: on
  # an event bus, refusing writes beats silently dropping undelivered events.
  # Change the two together.
  #
  # Redis was OOMKilled three times at a 256Mi limit with maxmemory unset, the
  # last of them the 2026-09-06 bus outage. The limit is now generous on
  # purpose: the node has ~62Gi and this is the event bus for 38 services, so
  # headroom is far cheaper than another bus outage.
  maxmemory: 3gb
  maxmemoryPolicy: noeviction
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: '2', memory: 4Gi }

# Durable trace store: Jaeger all-in-one on Badger. Retention and volume size
# MUST be changed together -- see the capacity arithmetic and scaling table in
# docs/07-observability/README.md. Defaults are the kind-cluster figures:
# 12h x 105 spans/s x 1.6 KiB/span = 6.9 GiB, provisioned at 10Gi (~45% headroom).
jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.57"
  storage:
    size: 10Gi
    storageClass: ""  # empty = default StorageClass ("standard" on kind)
  retention:
    spanStoreTtl: 12h        # --badger.span-store-ttl
    maintenanceInterval: 5m  # --badger.maintenance-interval
  # The jaeger image runs as uid 10001 / gid 0; fsGroup makes the mounted volume
  # group-writable for it.
  fsGroup: 10001
  # GOMEMLIMIT: keep at ~85% of resources.limits.memory so the Go runtime
  # collects before the kubelet OOM-kills the container.
  gomemlimit: 3400MiB
  # limits.memory MUST stay well above 576Mi: Badger allocates a 256MiB block
  # cache plus up to 5 x 64MiB memtables before storing a single span. Measured
  # 770Mi steady after 200k spans, 1.76Gi peak during burst ingest.
  #
  # Raised from 2Gi after OOMKills on a long-running cluster. The mechanism is
  # Badger's LSM compaction, not a per-span cost: a compaction reads whole SST
  # tables into memory, so the cost scales with how much data has ACCUMULATED,
  # not with how fast it arrives. A cluster left running past the point where
  # the 12h TTL reaches steady state needs materially more headroom than one
  # that has just started, and a restart re-attempts the pending compaction
  # work rather than clearing it.
  #
  # Memory is not the binding constraint here, so do not expect a further raise
  # to help. No sampler is configured (100% head sampling) and ingest runs well
  # above the 105 spans/s the arithmetic above assumes, while kind's local-path
  # provisioner does not enforce storage.size -- so the TTL is the only bound on
  # the volume and it does not hold at this rate. See deploy/KNOWN-ISSUES.md.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '2', memory: 4Gi }

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.103.1"
  # memory_limiter.limit_mib. Must stay ABOVE sendingQueue (a limiter smaller
  # than the queue makes the collector refuse spans it could buffer) and BELOW
  # resources.limits.memory.
  memoryLimitMiB: 768
  # Bounded in-memory queue on the Jaeger exporter, paired with retry_on_failure.
  # The trace store holds an exclusive lock on its Badger volume, so replacing
  # its pod takes it offline for a few seconds; without this, spans emitted in
  # that window are dropped instead of redelivered.
  sendingQueue:
    numConsumers: 4
    queueSize: 4000
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

mailpit:
  enabled: true
  image:
    repository: axllent/mailpit
    tag: "v1.22.3"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# -- Loadgen -----------------------------------------------------------------

loadgen:
  enabled: true
  replicas: 1
  # NOTE: customer concurrency is set by run.workers in
  # deploy/helm/train-ticket/loadgen-config.yaml, not from here -- the
  # template has no way to inject it into the mounted config file.
  gomaxprocs: 6
  resources:
    requests: { cpu: '1', memory: 512Mi }
    limits: { cpu: '6', memory: 2Gi }
  # emptyDir cap for /data, which holds the entity registry (run.state_file) and
  # the per-request record file (recording.path). A guard against a
  # misconfigured recording.max_file_megabytes becoming node disk pressure, not
  # a reservation.
  stateSizeLimit: 2Gi

# -- Defaults applied to every service ---------------------------------------

defaults:
  # Extra env injected into every service Deployment. Per-service
  # `services.<name>.env` wins on key collision.
  #
  # Deliberately empty by default: the four Redis-consumer knobs
  # (EVENT_STREAM_MAXLEN, MAX_REDELIVERY_ATTEMPTS, AUTOCLAIM_MIN_IDLE_MS,
  # REDIS_LIVENESS_GRACE_MS) are NOT set here. Their in-code defaults (10000,
  # 100, 300000, 300000) are the intended production values and are documented
  # at their definitions in platform/java-kit and platform/ts-kit; pinning them
  # here would create a second place to keep in sync that silently overrides
  # the first, which is how the loadgen config drifted. Set one only when an
  # environment genuinely needs a different value.
  #
  # MaxRAMPercentage is the exception, and it belongs here rather than
  # per-service because the JVM's own container default is actively wrong: it
  # takes 25% of the cgroup limit as max heap, so a 1Gi limit yields a 256MB
  # heap and the other 768Mi is never used. post-sales died of
  # `java.lang.OutOfMemoryError: Java heap space` inside a CapacityReleased
  # handler at exactly that ratio, while its container sat well under its own
  # memory limit -- killed by a heap it had no reason to be confined to.
  #
  # 70% leaves room for metaspace, thread stacks (4 consumer threads plus
  # Tomcat) and direct buffers, all of which live outside the heap and still
  # count against the cgroup. Harmless for the non-JVM services, which ignore
  # JAVA_TOOL_OPTIONS.
  env:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
  # Applied when a service sets no `resources` of its own. The floor a plain
  # HTTP-plus-Postgres service needs; anything CPU- or memory-hungry declares
  # its own block under `services.<name>.resources` below.
  #
  # 512Mi is not enough for a JVM event consumer, independently of CPU: at the
  # MaxRAMPercentage=70 above it leaves only ~154Mi for metaspace, thread stacks
  # and direct buffers, under what Boot 4 uses off-heap, so the cgroup kills the
  # container while the heap still looks healthy. A JVM service that consumes
  # streams should declare its own memory tier.
  #
  # A service's `resources` REPLACES this block wholesale (services.yaml uses
  # `default`, not `merge`), so an override must restate all four values.
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 2Gi }
  probes:
    # A startupProbe on /healthz holds liveness off during a slow start, so
    # liveness can stay on /healthz (process liveness) instead of being pointed
    # at the dependency-checking /readyz, which would turn a slow Postgres into
    # a kubelet restart loop.
    startup: true
    startupFailureThreshold: 12  # 12 x 5s = 60s of startup tolerance

# -- Microservices -----------------------------------------------------------
# Each service follows the same pattern. Override replicas, env, resources,
# pgInstance and probes here.

services:
  dispatch:
    db: dispatch
  place-network:
    db: place_network
  service-plan:
    db: service_plan
  capacity-availability:
    db: capacity_availability
  fare-pricing:
    db: fare_pricing
    env:
      IDENTITY_VERIFICATION_URL: http://identity-verification:8080
  trip-planning:
    db: trip_planning
    env:
      MIGRATIONS_DIR: /app/migrations
    # trip-planning is CPU-bound on search, so it gets a 2-core ceiling on a
    # smaller memory footprint than the shared default.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: '2', memory: 256Mi }
  ancillary-service:
    db: ancillary_service
  offer-management:
    db: offer_management
    env:
      PG_MAX_POOL_SIZE: "15"
      CONSUMER_THREADS: "4"   # 5 streams
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  journey-order:
    db: journey_order
    env:
      IDENTITY_VERIFICATION_URL: http://identity-verification:8080
      IDENTITY_VERIFICATION_PREORDER_ENABLED: "true"
      # Order items are priced from the offer's total rather than a literal
      # 100.00. post-sales derives the refund penalty base from the order fare, so
      # the placeholder mispriced every refund -- correct tier percentages applied
      # to the wrong number.
      OFFER_MANAGEMENT_URL: http://offer-management:8080
      # journey-order consumes 11 streams and its handler is no longer
      # `synchronized`; without this the platform subscriber falls back to
      # DEFAULT_CONSUMER_THREADS=1 and the unlocked handler gains nothing.
      CONSUMER_THREADS: "4"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  booking-orchestration:
    db: booking_orchestration
    env:
      CONSUMER_THREADS: "4"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  identity-verification:
    db: identity_verification
  payment:
    db: payment
    env:
      CONSUMER_THREADS: "4"   # 4 streams
    # JVM event consumer on 4 streams. 512Mi is not enough at
    # MaxRAMPercentage=70 -- see the note on defaults.resources. The CPU limit
    # goes with CONSUMER_THREADS above: 4 threads do not fit in 500m, and
    # starving them makes the HTTP thread miss its probe timeout.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  provider-integration:
    db: provider_integration
  entitlement-ticketing:
    db: entitlement_ticketing
    env:
      SEAT_ASSIGNMENT_BASE_URL: http://seat-assignment:8080
  fulfillment:
    db: fulfillment
  post-sales:
    db: post_sales
    env:
      # 5 streams (journey-order, capacity-availability, dispatch,
      # ancillary-service, disruption-recovery) on one thread could not keep up:
      # the live cluster held 3522 pending messages on events:journey-order under
      # this consumer group. The visible effect was NOT a stuck consumer -- the
      # backlog drained at ~2/s -- but a timing failure downstream: a refund
      # request arriving before its order's JourneyOrderCreated had been processed
      # found no policy context, fell back to departureTime=now, and quoted a zero
      # refund. See the MISS/HIT logging in PostSalesApplicationService.
      CONSUMER_THREADS: "4"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    #
    # 2 cores rather than 1: this is the busiest Java consumer -- 5 streams, and
    # every refund it prices makes a synchronous call to fare-pricing while
    # holding its thread. At 1 core the cgroup throttled a fifth of its periods,
    # for longer in aggregate than the 10s liveness timeout, so /healthz (a
    # constant map, no work of its own) still missed the probe and the pod took
    # a SIGTERM mid-suite. The request stays low; this is a burst ceiling.
    #
    # 3Gi for the same reason. At 2Gi it settled at 1.76G -- flat, not growing,
    # so not a leak -- which is what MaxRAMPercentage=70 permits it to reach, and
    # that left under 400Mi for a GC burst on top of metaspace, code cache and
    # Lettuce's direct buffers. The cgroup killed it (exit 137) rather than the
    # heap failing, and the probe timeouts in the minutes before were GC pressure,
    # not the earlier CPU starvation.
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: '2', memory: 3Gi }
  notification:
    db: notification
    env:
      SMTP_URL: smtp://mailpit:1025
      # 11 streams. Also had ~1000 pending messages against one thread, which is
      # why e2e assertions on NotificationScheduled/NotificationDelivered timed
      # out intermittently.
      CONSUMER_THREADS: "4"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  traveler-profile:
    db: traveler_profile
    # JVM event consumer -- see the note on defaults.resources.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 2Gi }
  risk-compliance:
    db: risk_compliance
  corporate-travel:
    db: corporate_travel
  account:
    db: account
  loyalty-membership:
    db: loyalty_membership
  admin-audit:
    db: admin_audit
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 1Gi }
  customer-service:
    db: customer_service
    env:
      CONSUMER_THREADS: "4"   # 5 streams
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  finance-settlement:
    db: finance_settlement
    env:
      CONSUMER_THREADS: "4"   # 7 streams
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  reporting:
    db: reporting
    env:
      # reporting consumes 37 streams -- every fact-producing service in the
      # system -- against DEFAULT_CONSUMER_THREADS=1. That is the widest fan-in
      # here by a factor of three, and it is why e2e assertions on the reporting
      # read model ("reporting stream empty", "dashboard fact count did not
      # change", "dash-revenue status unexpected (building)") failed repeatedly:
      # the dashboard was still rebuilding from a backlog when the assertion ran.
      # 8 rather than 4 for the same reason the number is not simply "more":
      # threads are per-subscriber, and this one has 37 streams to interleave.
      CONSUMER_THREADS: "8"
      WEB_CONCURRENCY: "2"
    # 8 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1500m', memory: 4Gi }
  supplier-catalog:
    db: supplier_catalog
  legacy-acl:
    db: legacy_acl
  waitlist:
    db: waitlist
    env:
      MIGRATIONS_DIR: /app/migrations
      FARE_PRICING_BASE_URL: http://fare-pricing:8080
      OFFER_MANAGEMENT_BASE_URL: http://offer-management:8080
      JOURNEY_ORDER_BASE_URL: http://journey-order:8080
  wallet-promotion:
    db: wallet_promotion
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 1Gi }
  disruption-recovery:
    db: disruption_recovery
    env:
      POST_SALES_URL: http://post-sales:8080
      WALLET_PROMOTION_URL: http://wallet-promotion:8080
      TRANSFER_MANAGEMENT_URL: http://transfer-management:8080
  transfer-management:
    db: transfer_management
    env:
      DISRUPTION_RECOVERY_URL: http://disruption-recovery:8080
      PLACE_NETWORK_URL: http://place-network:8080
  seat-assignment:
    db: seat_assignment
  payment-channel:
    db: payment_channel
    # A daily channel statement is one jsonb row holding every reconciliation
    # line for that channel and date, and the loadgen appends one per channel
    # order. On this cluster channel_statement_snapshots held 18 rows in 119 MB
    # -- the largest a single 14 MB row with 71,633 lines -- and loading one to
    # freeze it or to open a discrepancy OOMKilled the pod at the default 512Mi.
    # That took out 22-paychan's three statement assertions with connection
    # failures rather than anything that named memory.
    #
    # This is headroom, not a fix: the row grows without bound over the life of
    # the deployment, so the statement model needs splitting into line rows. See
    # deploy/KNOWN-ISSUES.md.
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 2Gi }
  invoicing:
    db: invoicing
    env:
      # NOT raised above 1, unlike the other multi-stream consumers, and it was a
      # mistake to try. invoicing keeps its entire aggregate, projection and
      # idempotency state in ONE jsonb row (`invoicing_state`, id = 1) and takes
      # `SELECT ... FOR UPDATE` on it for every command and every consumed event.
      # See the design note at services/invoicing/src/adapters/storage.rs:5 --
      # the row lock is deliberate, it is what makes "no update can be lost" true.
      #
      # So writers are serialized by construction and extra consumer threads
      # cannot overlap; they only queue behind the same lock. That row had grown
      # to 3.78 MB, every event rewrote all of it, and the UPDATE was logging
      # `slow statement ... elapsed=1.02s`. With 4 threads contending, invoicing
      # fell far enough behind that booking sagas timed out at their INVOICING
      # step -- the fix made the symptom worse.
      #
      # Raising throughput here means splitting that row into the ten real tables
      # the schema already has (all currently empty), which is a storage redesign,
      # not a tuning knob.
      CONSUMER_THREADS: "1"
      # The pool must cover the consumer threads plus the HTTP handlers plus the
      # outbox relay, all of which contend at startup. rust-kit defaults to 10
      # with a 5s acquire_timeout, and 4 consumer threads did not fit: invoicing
      # panicked during startup with SubscribeFailed("pool timed out while waiting
      # for an open connection"). Postgres itself was nowhere near its ceiling
      # (101 of 500 connections), so this is per-service pool sizing, not a
      # server limit.
      PG_MAX_POOL_SIZE: "25"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }
  marketing-campaign:
    db: marketing_campaign
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 1Gi }
  group-booking:
    db: group_booking
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 1Gi }
  travel-insurance:
    db: travel_insurance
    # Go, not JVM, so MaxRAMPercentage in defaults.env does nothing here.
    # Untuned the Go runtime sizes the heap against total machine memory and
    # ignores the cgroup limit, so GOMEMLIMIT must be set with the limit, at
    # ~85% of it. Change the two together.
    env:
      GOMEMLIMIT: "435MiB"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 512Mi }

# -- Per-service overrides ---------------------------------------------------
# Example:
#   services:
#     journey-order:
#       replicas: 2
#       pgInstance: hot          # key of postgres.instances
#       resources:
#         requests: { cpu: 200m, memory: 256Mi }
#         limits: { memory: 512Mi }
#       probes:
#         startup: false         # drop the startupProbe for this service
#         startupFailureThreshold: 24
