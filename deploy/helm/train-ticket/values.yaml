global:
  # The resident cluster pulls every service image from this registry, and its
  # nodes accept no side-loaded image, so imagePullPolicy is Always: a moving
  # `local` tag is only picked up by a pull.
  imageRegistry: mirrors.tencent.com
  imageOrg: microservice
  # Single repository for every service image, with the service name folded
  # into the tag (`<repo>:<service>-<tag>`) instead of one repository per
  # service. Empty keeps the per-service layout. See `train-ticket.image`.
  imageRepo: ""
  imageTag: "local"
  imagePullPolicy: Always
  # Registry for the upstream infra images (postgres, redis, busybox, jaeger,
  # otel, mailpit). Defaults to `imageRegistry`, which is only correct when
  # that registry is a docker.io pull-through mirror. Set it to "" on a plain
  # registry so those images come from docker.io. See `train-ticket.infraImage`.
  infraRegistry: ""

# -- Infrastructure ----------------------------------------------------------

postgres:
  bootstrapImagePullPolicy: IfNotPresent
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 20Gi
    # This cluster's provisioner. It is hostPath-backed, so a PVC request is a
    # declaration of intent rather than a cap.
    storageClass: local-path
  credentials:
    username: trainticket
    password: trainticket-dev
  # Shard that the bare `postgres` ExternalName alias points at, and the shard
  # used by every service that does not set its own `pgInstance`. Must be a key
  # of `postgres.instances` below; the template fails the render if it is not.
  defaultInstance: core
  # PostgreSQL is split by workload shape. The five non-core shards are pinned
  # to the roomier second node; `core` keeps the long-lived source volume on its
  # original node. During an online migration the database names temporarily
  # exist in both `core` and their target shard. Services continue to use core
  # until their database has been copied and checked, then `pgInstance` is
  # switched in a separate release.
  #
  # The union of all shards' `databases` MUST cover every `services.<name>.db`
  # below -- a missing entry means the service starts, connects, and fails on
  # its first query. See the initdb caveat in templates/postgres.yaml: on an
  # already-initialised volume, adding a name here has no effect until the
  # database is created by hand.
  #
  # Each instance may override `storageSize`, `storageClass` and `nodeSelector`.
  # This matters for a sharded local-path deployment: every PVC is pinned to the
  # node selected for its first database Pod, so placement and disk headroom
  # must be explicit rather than left to scheduler order.
  instances:
    hot:
      databases:
        - journey_order
        - booking_orchestration
      storageSize: 100Gi
      maxConnections: 300
      sharedBuffers: 4GB
      workMem: 8MB
      maxWalSize: 16GB
      walCompression: lz4
      shmSize: 2Gi
      maxWorkerProcesses: 24
      maxLogicalReplicationWorkers: 20
      maxSyncWorkersPerSubscription: 8
      nodeSelector: &database_target_node
        kubernetes.io/hostname: vm-197-212-tencentos
      resources:
        requests: { cpu: '2', memory: 4Gi }
        limits: { cpu: '20', memory: 20Gi }
    txn:
      databases:
        - payment
        - entitlement_ticketing
        - payment_channel
        - post_sales
        - finance_settlement
      storageSize: 120Gi
      maxConnections: 400
      sharedBuffers: 6GB
      workMem: 8MB
      maxWalSize: 16GB
      walCompression: lz4
      shmSize: 2Gi
      maxWorkerProcesses: 24
      maxLogicalReplicationWorkers: 20
      maxSyncWorkersPerSubscription: 8
      nodeSelector: *database_target_node
      resources:
        requests: { cpu: '2', memory: 4Gi }
        limits: { cpu: '24', memory: 24Gi }
    read:
      databases:
        - trip_planning
        - fare_pricing
        - offer_management
        - capacity_availability
        - seat_assignment
        - service_plan
        - place_network
      storageSize: 230Gi
      maxConnections: 450
      sharedBuffers: 10GB
      workMem: 8MB
      maxWalSize: 24GB
      walCompression: lz4
      shmSize: 2Gi
      maxWorkerProcesses: 24
      maxLogicalReplicationWorkers: 20
      maxSyncWorkersPerSubscription: 8
      nodeSelector: *database_target_node
      resources:
        requests: { cpu: '3', memory: 8Gi }
        limits: { cpu: '32', memory: 40Gi }
    user:
      databases:
        - account
        - traveler_profile
        - identity_verification
      storageSize: 130Gi
      maxConnections: 300
      sharedBuffers: 6GB
      workMem: 8MB
      maxWalSize: 16GB
      walCompression: lz4
      shmSize: 2Gi
      maxWorkerProcesses: 24
      maxLogicalReplicationWorkers: 20
      maxSyncWorkersPerSubscription: 8
      nodeSelector: *database_target_node
      resources:
        requests: { cpu: '2', memory: 4Gi }
        limits: { cpu: '24', memory: 24Gi }
    event:
      databases:
        - reporting
        - invoicing
        - notification
        - risk_compliance
      storageSize: 250Gi
      maxConnections: 350
      sharedBuffers: 12GB
      workMem: 8MB
      maxWalSize: 24GB
      walCompression: lz4
      shmSize: 2Gi
      maxWorkerProcesses: 24
      maxLogicalReplicationWorkers: 20
      maxSyncWorkersPerSubscription: 8
      nodeSelector: *database_target_node
      resources:
        requests: { cpu: '3', memory: 8Gi }
        limits: { cpu: '32', memory: 48Gi }
    core:
      # The existing cluster is migrated online from this source. Logical
      # replication keeps each target shard current while its initial table
      # copy runs; services switch only after row counts, lag and sequences
      # have been checked. These settings remain useful for shard evacuation
      # and disaster recovery after the one-time split.
      walLevel: logical
      maxReplicationSlots: 40
      maxWalSenders: 40
      maxSlotWalKeepSize: 64GB
      databases:
        - account
        - admin_audit
        - ancillary_service
        - booking_orchestration
        - capacity_availability
        - corporate_travel
        - customer_service
        - dispatch
        - disruption_recovery
        - entitlement_ticketing
        - fare_pricing
        - finance_settlement
        - fulfillment
        - group_booking
        - identity_verification
        - invoicing
        - journey_order
        - loyalty_membership
        - marketing_campaign
        - notification
        - offer_management
        - payment
        - payment_channel
        - place_network
        - post_sales
        - provider_integration
        - reporting
        - risk_compliance
        - seat_assignment
        - service_plan
        - supplier_catalog
        - transfer_management
        - travel_insurance
        - traveler_profile
        - trip_planning
        - waitlist
        - wallet_promotion
      # Sized with real headroom rather than "just enough not to OOM". The node
      # this runs on has ~62Gi and only a few cores committed, so being frugal
      # here buys nothing and has already cost two outages: Postgres was
      # OOMKilled twice at a 512Mi limit, and a later attempt to trim
      # max_connections to 250 -- sized against a 180-connection observation
      # taken while the loadgen was still warming up -- was blown past during a
      # rolling restart, when old and new pods hold their pools concurrently.
      # Postgres then refused with "sorry, too many clients already", which
      # broke transactions mid-flight and silently stopped identity-verification
      # from publishing its outbox events.
      #
      # 700 rather than 500, because 500 had become the binding constraint on
      # the purchase funnel rather than a headroom figure. Measured: 482 of 500
      # in use, with identity_verification holding 92 and fare_pricing 72 while
      # their own metrics reported 0.4 and 0.7 connections actually in use. Both
      # are sized per uvicorn worker against a measured burst latency, so the
      # idle breadth is deliberate and not waste to reclaim.
      #
      # What that left was 18 free connections, so offer-management could not be
      # given back the pool its second replica had to halve, and both its pods
      # sat at 30 of 30 used with 106 requests queued while the consumer fell
      # behind events:fare-pricing again.
      #
      # 700 at 8MB work_mem is the sizing constraint, and the limit below moves
      # with it: the peak working set was 22341 MiB against a 24Gi limit, which
      # is 93% of the cgroup bound, so connections could not be raised against
      # the old ceiling. The node carries 251Gi at 33% used, so the ceiling was
      # the limit rather than the hardware. shared_buffers stays at the
      # conventional ~25%.
      # 1200 rather than 700: the steady state holds 872 connections once every
      # pool is at its configured size, and a rolling update holds the old and
      # the new pod of the service it replaces at the same time. At 700 that
      # left fewer connections free than one replacement needs, and offer
      # management answered 500 with "sorry, too many clients already" during a
      # rollout. The margin above 872 covers two services replacing at once.
      maxConnections: 1200
      sharedBuffers: 1GB
      workMem: 8MB
      maxWalSize: 8GB
      walCompression: lz4
      # /dev/shm 的大小,并行查询的 DSM 段从这里分配。实测常驻约 126 个段,
      # 其中 69 个 192KiB、46 个 1MiB、2 个 2MiB,合计接近 64MiB,也就是容器
      # 默认值。1Gi 给出约 16 倍余量,足够覆盖 max_parallel_workers 提高或
      # 并发查询增长,而它是内存卷,不占用则不消耗内存。
      shmSize: 1Gi
      # This is the one scope where a ceiling contaminates every measurement: it
      # is the shared store, so a limit here couples services that share nothing
      # else. Measured under the shaped profile: p50 4.596 cores, p95 7.811 and
      # peak 8.003 against the previous 8-core limit, with a peak working set of
      # 7482 MiB against 8Gi -- 91% of the cgroup bound. Persistent load, not a
      # burst, so both ceilings were being reached rather than approached.
      #
      # shared_buffers deliberately stays at 1GB. It is not sized as a fraction
      # of this limit: the working set that fills the ceiling is connection-local
      # (500 clients x 8MB work_mem), and raising the shared cache would take
      # memory from exactly the thing that needed it.
      #
      # 32 cores, because 12 was binding for an entire hour: 87-100% of the
      # limit continuously, never dipping with the envelope's trough, while
      # 7633 of 485732 client requests failed in transport at exactly the
      # loadgen's 10s timeout. The peak that sized 12 was 8.003 cores, measured
      # within one phase of the cycle rather than across it. Lifted, it went
      # straight to 13.7 -- above the old cap, so it had been clipped all along.
      #
      # This is the one pod whose demand is the whole system's demand, and the
      # one scope where a ceiling contaminates every measurement at once.
      # 40Gi rather than 24Gi, and it moves with maxConnections above. The peak
      # working set was 22341 MiB against the 24Gi limit, which is 93% of the
      # bound, and 200 more connections at 8MB work_mem is another ~1.6Gi of
      # per-backend headroom on top of that. Raising connections against the old
      # limit would have traded a "too many clients" refusal for an OOMKill.
      #
      # The node carries 251Gi at 33% used, so this is the same argument the
      # comment above makes for CPU: a ceiling on this pod contaminates every
      # measurement in the system, and being frugal here has already cost two
      # outages.
      resources:
        requests: { cpu: '1', memory: 4Gi }
        # 80Gi rather than 56Gi: the working set reached 53999Mi against the 56Gi
        # bound while operating at 1200 connections, which is one burst away
        # from an OOMKill of the shared store. The node carries 251Gi.
        limits: { cpu: '32', memory: 80Gi }

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  # maxmemory must stay BELOW resources.limits.memory so Redis enforces its own
  # bound rather than being OOMKilled by the cgroup -- the ~75% ratio below
  # covers allocator fragmentation and client output buffers, which maxmemory
  # (a logical-dataset bound) does not account for. Policy stays noeviction: on
  # an event bus, refusing writes beats silently dropping undelivered events.
  # Change the two together.
  #
  # Redis was OOMKilled three times at a 256Mi limit with maxmemory unset, the
  # last of them the 2026-09-06 bus outage. The limit is now generous on
  # purpose: the node has ~62Gi and this is the event bus for 38 services, so
  # headroom is far cheaper than another bus outage.
  maxmemory: 3gb
  maxmemoryPolicy: noeviction
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    # 6Gi against a 3gb dataset bound: the event bus is the one component every
    # service waits on, and its output buffers and fragmentation are what the
    # cgroup bound has to cover.
    limits: { cpu: '4', memory: 6Gi }

# Durable telemetry store for all three signals. See templates/clickhouse.yaml
# for why this is a StatefulSet with a real volume, and
# docs/07-observability/README.md for the retention and capacity arithmetic.
clickhouse:
  # Signals go to the store outside this release: the resident namespace is
  # deleted when the environment is torn down, and an in-namespace store takes
  # the measured window with it.
  enabled: false
  # Where the collectors send. Empty means this release's own store, which is
  # the right answer for a deployment that outlives its data.
  #
  # Set it to a store outside the release -- `clickhouse.telemetry.svc.cluster.local`
  # -- when the release is disposable and the data is not, and set
  # `enabled: false` alongside so the release does not run a store nothing
  # writes to. A fault case is exactly that: its namespace is deleted when the
  # case is over, and the PVC is in the namespace, so an in-namespace store
  # takes the measured window with it.
  host: clickhouse.telemetry.svc.cluster.local
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8-alpine"
  # NOT `default`. Every query and every exporter names this database
  # explicitly, so the two must agree -- a mismatch produces "table does not
  # exist" against a store that is filling up normally.
  database: otel
  auth:
    username: default
    password: trainticket-otel
  # Applied by the exporter as a TTL clause when it creates the tables. Only
  # takes effect at CREATE time: changing this does not retro-fit a TTL onto
  # tables that already exist.
  #
  # 72h rather than the 12h the Badger store used. ClickHouse compresses
  # columnar telemetry roughly 10:1, so a longer window costs less disk than the
  # shorter one did, and a window that spans more than one working day is what
  # makes "compare this to yesterday" possible.
  ttl: 72h
  # The image runs as uid/gid 101.
  fsGroup: 101
  storage:
    size: 50Gi
    storageClass: local-path
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: '4', memory: 8Gi }

# Jaeger is retired: the trace store is ClickHouse now, and this key exists only
# so a values file that still sets it renders. There is no Jaeger template.
jaeger:
  enabled: false

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    # 0.112.0, not 0.103.1: the clickhouse exporter's config schema settled
    # after 0.103 (ttl replaced ttl_days) and the k8sobjects receiver this stack
    # needs for the event stream is not in the older image.
    tag: "0.112.0"
  # memory_limiter.limit_mib on the OTLP gateway. Must stay ABOVE sendingQueue
  # (a limiter smaller than the queue makes the collector refuse spans it could
  # buffer) and BELOW resources.limits.memory.
  memoryLimitMiB: 768
  # Bounded in-memory queue on the ClickHouse exporter, paired with
  # retry_on_failure. ClickHouse holds an exclusive lock on its volume, so
  # replacing its pod takes it offline for a few seconds; without this, signals
  # emitted in that window are dropped instead of redelivered. Shared by all
  # three collectors.
  sendingQueue:
    numConsumers: 4
    queueSize: 4000
  # OTEL_METRIC_EXPORT_INTERVAL on every service, in milliseconds. 15s rather
  # than the SDK default of 60s: a connection pool saturates and recovers inside
  # a minute, and a 60s period can place a whole episode between two points --
  # the level being sampled is instantaneous, not an average over the interval,
  # so a missed sample is a missed event rather than a smoothed one.
  #
  # The cost is four times the metric points. They are the smallest of the three
  # signals by disk (see docs/07-observability/README.md) and the series count is
  # what dominates, not the period.
  metricExportIntervalMillis: 15000
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: '1', memory: 1Gi }

  # Per-node collector: pod logs, kubelet stats, host metrics.
  # See templates/otel-agent.yaml.
  agent:
    enabled: true
    # memory_limiter here is percentage-based, so the runtime must be told the
    # container limit or it sizes itself against the node. Keep at ~85% of
    # resources.limits.memory.
    gomemlimit: 1740MiB
    filelog:
      # Namespaces whose pod logs are not collected. kube-system is control-plane
      # chatter at a volume that dwarfs the application logs; local-path-storage
      # is kind's provisioner. The collectors' own pods are excluded by name in
      # the template -- ingesting them is a feedback loop, since the collector
      # logs every export it performs.
      excludeNamespaces:
        - kube-system
        - local-path-storage
      # Collect only this release's own namespace. Off by default: one release
      # on a node wants the whole node, which is the operator's view of it.
      #
      # Turn it on where several releases share a node, as concurrent fault
      # cases do. Each agent is a DaemonSet, so N releases put N agents on
      # every node and each one tails every pod: measured with two up, each
      # store held 363751 of 1581766 log rows from the OTHER namespace over
      # five minutes, and both agents sat at 100% of their 1-core limit.
      ownNamespaceOnly: true
    kubeletstats:
      collectionInterval: 15s
    hostmetrics:
      collectionInterval: 30s
    resources:
      # Higher than the gateway's: filelog holds a reader per tailed file, and
      # this node runs ~45 pods.
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }

  # Cluster-scoped collector: k8s object state, k8s events, Prometheus
  # federation. See templates/otel-cluster.yaml.
  cluster:
    enabled: true
    gomemlimit: 1740MiB
    k8sCluster:
      collectionInterval: 30s
    federate:
      scrapeInterval: 30s
      # What /federate returns, and therefore what reaches ClickHouse. A metric
      # matched by none of these selectors stays in Prometheus only.
      #
      # Deliberately selective rather than '{__name__=~".+"}': federating
      # everything at 30s would write every cAdvisor and kube-state series into
      # ClickHouse, which is a large multiple of the application telemetry and
      # mostly duplicates what kubeletstats and k8s_cluster already provide with
      # proper resource attributes.
      match:
        - '{__name__=~"kube_pod_status_.*|kube_pod_container_status_.*"}'
        - '{__name__=~"kube_deployment_status_.*|kube_deployment_spec_replicas"}'
        - '{__name__=~"kube_statefulset_status_.*|kube_daemonset_status_.*"}'
        - '{__name__=~"kube_node_status_.*|kube_node_spec_.*"}'
        - '{__name__=~"container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_rss"}'
        - '{__name__=~"container_network_(receive|transmit)_(bytes|packets|errs|packets_dropped)_total"}'
        - '{__name__=~"container_fs_(reads|writes)_bytes_total|container_fs_usage_bytes"}'
        - '{__name__=~"node_cpu_seconds_total|node_load1|node_load5|node_load15"}'
        - '{__name__=~"node_memory_Mem(Total|Available|Free)_bytes|node_memory_Cached_bytes"}'
        - '{__name__=~"node_filesystem_(size|avail|free)_bytes"}'
        - '{__name__=~"node_disk_(read|written)_bytes_total|node_disk_io_time_seconds_total"}'
        - '{__name__=~"node_network_(receive|transmit)_bytes_total"}'
        - '{__name__=~"apiserver_request_total|apiserver_request_duration_seconds_bucket"}'
        - '{__name__=~"kubelet_running_(pods|containers)|kubelet_pod_start_duration_seconds_bucket"}'
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '1', memory: 2Gi }

# -- Prometheus tier ---------------------------------------------------------
#
# Scrapes what has no OTel receiver (cAdvisor's container_*, kube-state's
# kube_*), keeps a short local window for ad-hoc PromQL, and is federated into
# ClickHouse by the cluster collector. See templates/prometheus.yaml.

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "v2.55.1"
  scrapeInterval: 30s
  # Short on purpose: ClickHouse holds the durable copy (clickhouse.ttl above),
  # so a long window here would retain the same samples twice.
  retention: 6h
  clusterLabel: train-ticket-kind
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: '4', memory: 6Gi }

kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: "v2.13.0"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

nodeExporter:
  enabled: true
  image:
    repository: quay.io/prometheus/node-exporter
    tag: "v1.8.2"
  # hostPort, so it must not collide with anything else on the node.
  port: 9100
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

mailpit:
  enabled: true
  image:
    repository: axllent/mailpit
    tag: "v1.22.3"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 2000m, memory: 1Gi }

# -- Loadgen -----------------------------------------------------------------

loadgen:
  enabled: true
  replicas: 1
  # NOTE: customer concurrency is set by run.workers in
  # deploy/helm/train-ticket/loadgen-config.yaml, not from here -- the
  # template has no way to inject it into the mounted config file.
  gomaxprocs: 6
  # Write each per-request record to stdout as well as to the file, so the
  # collector carries it into the same store as the traces it joins to.
  #
  # Off by default: a long-lived deployment has the file under /data, and this
  # doubles the log volume of the busiest pod on the node.
  #
  # On for a release whose namespace is deleted when it ends. The record file
  # is an emptyDir and goes with it, and client outcomes are the one signal
  # the server side cannot reconstruct -- a request that never got a status
  # leaves no server span at all.
  recordToStdout: true
  # Compress the arrival envelope, in seconds. Empty keeps what
  # loadgen-config.yaml says (1800), which is chosen so a person watching the
  # cluster can see the shape go round.
  #
  # A deployment that is MEASURED wants it shorter: a window has to cover a
  # whole period or it reads one phase of the envelope rather than the change,
  # and three windows at 30 minutes is two and a half hours per case. The
  # shape is unchanged either way -- same peak and trough, same Poisson gaps.
  #
  # Not below the burst schedule (~7 min mean gap): a period shorter than that
  # leaves a window with no bursts, and queues form from variance.
  diurnalPeriodSeconds: 600
  resources:
    requests: { cpu: '1', memory: 512Mi }
    # The generator must never be the bottleneck it measures: GOMAXPROCS is 6,
    # so the ceiling stays above that and the memory covers the entity registry
    # and the outcome record buffer.
    limits: { cpu: '8', memory: 3Gi }
  # emptyDir cap for /data, which holds the entity registry (run.state_file) and
  # the per-request record file (recording.path). A guard against a
  # misconfigured recording.max_file_megabytes becoming node disk pressure, not
  # a reservation.
  stateSizeLimit: 2Gi
  statePersistence:
    # The entity registry outlives the pod, so a restart continues the same
    # travelers and orders rather than starting a fresh population.
    enabled: true
    storageClass: local-path
    claimName: loadgen-resident-state

# -- Defaults applied to every service ---------------------------------------

defaults:
  # Extra env injected into every service Deployment. Per-service
  # `services.<name>.env` wins on key collision.
  #
  # Of the four Redis-consumer knobs (EVENT_STREAM_MAXLEN,
  # MAX_REDELIVERY_ATTEMPTS, AUTOCLAIM_MIN_IDLE_MS, REDIS_LIVENESS_GRACE_MS),
  # only the first is set here. The in-code defaults are documented at their
  # definitions in platform/java-kit and platform/ts-kit, and pinning one here
  # creates a second place to keep in sync that silently overrides the first,
  # which is how the loadgen config drifted. So one is set only where this
  # environment's throughput makes the default wrong, and this is that case.
  #
  # EVENT_STREAM_MAXLEN is a count of entries, and whether that count is
  # enough is a question about arrival rate. Measured under the shaped
  # profile: events:journey-order held its 10000-entry cap across a 370 second
  # window, so an entry is trimmed roughly six minutes after it is published.
  # AUTOCLAIM_MIN_IDLE_MS is 300000, so a message that a handler failed
  # becomes reclaimable 5 minutes in and has 70 seconds of retention left. At
  # that point booking-orchestration held 7800 pending messages on that
  # stream, and 90% of the load generator's saga lookups answered 404 while
  # only 246 of 16596 purchases completed.
  #
  # The two constants were sized against each other, both at 5 minutes, and
  # neither against the offered rate. 30000 puts the measured window near 18
  # minutes, so a message reclaimed at 5 minutes has 13 minutes of retention
  # left rather than 70 seconds.
  #
  # Not higher, because the entries are resident in Redis and their size is
  # measured, not assumed: events:journey-order holds 23.7MB for its 10000
  # entries, which is 2368 bytes each, and all 38 streams together hold 349MB
  # of the 3GB maxmemory that templates/redis.yaml sets. Tripling the cap puts
  # that near 1.05GB. The same arithmetic rules out the two-hour window that
  # the arrival rate alone would suggest: 200000 would need about 7GB.
  #
  # MaxRAMPercentage is the exception, and it belongs here rather than
  # per-service because the JVM's own container default is actively wrong: it
  # takes 25% of the cgroup limit as max heap, so a 1Gi limit yields a 256MB
  # heap and the other 768Mi is never used. post-sales died of
  # `java.lang.OutOfMemoryError: Java heap space` inside a CapacityReleased
  # handler at exactly that ratio, while its container sat well under its own
  # memory limit -- killed by a heap it had no reason to be confined to.
  #
  # 70% leaves room for metaspace, thread stacks (4 consumer threads plus
  # Tomcat) and direct buffers, all of which live outside the heap and still
  # count against the cgroup. Harmless for the non-JVM services, which ignore
  # JAVA_TOOL_OPTIONS.
  env:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    EVENT_STREAM_MAXLEN: "30000"
  # Applied when a service sets no `resources` of its own. The floor a plain
  # HTTP-plus-Postgres service needs; anything CPU- or memory-hungry declares
  # its own block under `services.<name>.resources` below.
  #
  # 512Mi is not enough for a JVM event consumer, independently of CPU: at the
  # MaxRAMPercentage=70 above it leaves only ~154Mi for metaspace, thread stacks
  # and direct buffers, under what Boot 4 uses off-heap, so the cgroup kills the
  # container while the heap still looks healthy. A JVM service that consumes
  # streams should declare its own memory tier.
  #
  # A service's `resources` REPLACES this block wholesale (services.yaml uses
  # `default`, not `merge`), so an override must restate all four values.
  #
  # The CPU ceiling is 2 cores rather than 500m because 500m was BINDING under
  # the shaped open-loop profile, not a safety margin. Measured on this cluster
  # at target_rps 20 with the diurnal peak at 4x: fare-pricing, identity-
  # verification and travel-insurance all sat at 100% of their limit, and the
  # client-side error rate was 13.5% -- almost all of it the loadgen's own 10s
  # timeout expiring, with identity-verification's client p50 pinned at exactly
  # 10000ms.
  #
  # That is a throttled baseline, and it makes the fault-injection work this
  # cluster exists for impossible rather than merely noisy. Every measure is
  # differential against a fault-free window, so a perturbation that is already
  # present in the baseline is invisible by construction -- and a saturated
  # service has no headroom left to express one. The node has 32 cores at 18%
  # requested, so the limit was costing accuracy and buying nothing.
  #
  # Requests stay small on purpose. They are what the scheduler packs against,
  # and 45 pods x 250m would reserve a third of the node for services that are
  # idle most of the time. Limits are the ceiling; requests are the floor.
  #
  # 6 rather than 2, for the same reason and one measurement later: over a full
  # envelope risk-compliance sat at 96.3% of the 2-core default, and it declares
  # no resources of its own. Every inheriting service gets the headroom, which
  # costs nothing -- the binding number is the request, and that is unchanged.
  resources:
    # Requests that cover an idle service; limits with room for a burst. The
    # cluster has two nodes of 72 cores and 251Gi, so the ceiling is the number
    # that decides whether a burst is served rather than a scarce resource.
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '8', memory: 4Gi }
  probes:
    # A startupProbe on /healthz holds liveness off during a slow start, so
    # liveness can stay on /healthz (process liveness) instead of being pointed
    # at the dependency-checking /readyz, which would turn a slow Postgres into
    # a kubelet restart loop.
    startup: true
    startupFailureThreshold: 12  # 12 x 5s = 60s of startup tolerance

# -- Microservices -----------------------------------------------------------
# Each service follows the same pattern. Override replicas, env, resources,
# pgInstance and probes here.

services:
  dispatch:
    db: dispatch
  place-network:
    db: place_network
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  service-plan:
    db: service_plan
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  capacity-availability:
    db: capacity_availability
    # Two replicas: every reservation takes a Hold here, and the pool locks are
    # database advisory locks, so replicas coordinate through PostgreSQL.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # The Booking stream peaks near two hundred events per second while a Hold
      # needs several database writes. Four threads fell behind during a peak
      # window, so the reservation confirmation missed the load generator
      # window. Twenty four holds the ramped peak at zero lag; a burst still
      # moves faster than this consumer.
      CONSUMER_THREADS: "24"
  fare-pricing:
    db: fare_pricing
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      IDENTITY_VERIFICATION_URL: http://identity-verification:8080
      # Four worker pools share a 64 connection budget.
      PG_MAX_POOL_SIZE: "16"
    # Same shape as identity-verification: p50 0.457 of a core, p95 1.915 and
    # peak 2.0 against the shared 2-core default, so the bursts are clipped.
    #
    # 8 rather than 4: peaked at 3.47 of 4 over a full envelope, which is one
    # envelope away from clipping and therefore one away from meaning nothing.
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: '8', memory: 6Gi }
  trip-planning:
    db: trip_planning
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      MIGRATIONS_DIR: /app/migrations
      # The pool is the search path's ceiling: searches waited over two seconds
      # to acquire a connection at the peak and answered 503 while the database
      # itself had spare capacity. One statement per search still needs a
      # connection per in-flight search.
      PG_MAX_POOL_SIZE: "32"
    # The in-memory plan index holds every published segment, about 1.4KB per
    # row with the three lookup maps: 533818 segments sat at 750Mi of resident
    # memory and the one GiB ceiling killed the pod with exit code 137 during a
    # peak search burst. Its searches then failed with connection refused and
    # the callers that read itineraries failed with 10 second timeouts.
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: '4', memory: 4Gi }
  ancillary-service:
    db: ancillary_service
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # The TypeScript kit reads CONSUMER_BATCH_CONCURRENCY, so one handler per
      # read batch was the effective concurrency. This consumer fell 2944 events
      # behind on the Journey Order stream during a burst while using 169m of a
      # six core limit.
      CONSUMER_BATCH_CONCURRENCY: "8"
      PG_MAX_POOL_SIZE: "24"
  offer-management:
    db: offer_management
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    # Three pods. Two was not enough once trip-planning stopped inventing
    # itineraries for routes it had no inventory for: real search volume rose,
    # so this service's share of it rose with it, and the pool went back to 60
    # of 60 used with 160 requests queued and a POST p99 of exactly 10008ms,
    # which is the client's own timeout rather than a latency.
    #
    # Three instances share a 72 connection budget.
    replicas: 3
    env:
      # Reserve database capacity for all service pools and rolling updates.
      PG_MAX_POOL_SIZE: "24"
      CONSUMER_THREADS: "4"   # 5 streams
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    #
    # 4 CPU because one core was not a ceiling it touched but the level it ran
    # at: measured under the shaped profile, p50 utilization was 0.973 of a 1
    # CPU limit and the peak 1.002, so it was throttled continuously rather than
    # at a spike. It is the busiest node on the purchase funnel -- 108k server
    # spans in fifteen minutes -- and 4 threads working a 5-stream backlog
    # alongside that HTTP load do not fit in one core.
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: '6', memory: 4Gi }
  journey-order:
    db: journey_order
    # Two replicas for the same reason as Booking Orchestration: eleven streams
    # share one handler pool, and the identity verification consumer alone
    # reached 29532 undelivered entries at the largest burst.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      IDENTITY_VERIFICATION_URL: http://identity-verification:8080
      IDENTITY_VERIFICATION_PREORDER_ENABLED: "true"
      # Order items are priced from the offer's total rather than a literal
      # 100.00. post-sales derives the refund penalty base from the order fare, so
      # the placeholder mispriced every refund -- correct tier percentages applied
      # to the wrong number.
      OFFER_MANAGEMENT_URL: http://offer-management:8080
      # Concurrent handlers cover database and identity HTTP waits across eleven streams.
      # Order row locks and event locks serialize updates to the same business state.
      # An identity burst produced five hundred to seven hundred events per second
      # and sixteen threads plateaued near five hundred, so the same consumer group
      # ran one hundred and forty seconds behind and trimmed entries before delivery.
      # Thirty two still fell eleven thousand events behind at the largest burst,
      # where the produced rate sits near seven hundred per second.
      CONSUMER_THREADS: "48"
      # Leave database connections for HTTP requests and the outbox relay.
      # 48 rather than 60: the steady connection total across all services is
      # the constraint that decides whether a rollout fits.
      HIKARI_MAX_POOL_SIZE: "52"
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '6', memory: 4Gi }
  booking-orchestration:
    db: booking_orchestration
    # Two replicas: the saga confirms a reservation through several hops, and a
    # burst of three to eight times the mean rate queued events behind the single
    # consumer group long enough for the load generator's ten second poll to
    # expire. The stream is a Redis consumer group and the saga writes are
    # versioned, so a second replica shares the work without new coordination.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # Eight streams share this handler pool, and the capacity stream alone
      # carried up to one hundred and forty events per second during a peak.
      # Four threads let the poll loop run handlers on the reading thread, and
      # the capacity group oscillated between zero and eight seconds of lag,
      # which is the confirmation delay the reservation poll waits through.
      # Twelve left a provider confirmation waiting ten seconds behind the
      # provider's own record, which is the edge of the reservation poll window.
      CONSUMER_THREADS: "32"
      # Leave database connections for HTTP requests and the outbox relay.
      HIKARI_MAX_POOL_SIZE: "32"
    # CPU headroom covers concurrent HTTP requests and event processing.
    resources:
      requests: { cpu: 500m, memory: 256Mi }
      limits: { cpu: '6', memory: 4Gi }
  identity-verification:
    db: identity_verification
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # Eight worker pools share the same 64 connection budget, so the HTTP and
      # subscriber concurrency doubles without adding connections. Two
      # subscribers on one process could not follow the identity verification
      # stream during a peak and its callers timed out.
      PG_MAX_POOL_SIZE: "8"
      WEB_CONCURRENCY: "8"
      # 30000 entries is forty three seconds of this stream at a burst of seven
      # hundred events per second, and the largest burst left 29532 undelivered;
      # the next step is trimming an event before a consumer reads it.
      EVENT_STREAM_MAXLEN: "90000"
    # Spiky rather than persistently hot: measured p50 utilization 0.285 of a
    # core against the shared 2-core default, with p95 and peak both at 2.0. So
    # the ceiling clips its bursts, and a clipped burst is a latency tail every
    # caller on the purchase funnel waits through. Raised here rather than in
    # `defaults.resources` because 21 services inherit that block and the other
    # 19 are nowhere near it.
    #
    # 12 rather than 4: measured over a full envelope, this pod sat at 99.7% of
    # a 4-core limit at every peak, and a peak that equals the limit says
    # nothing about demand. The ceiling is lifted clear so the next measurement
    # reports what the service wants.
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: '12', memory: 6Gi }
  payment:
    db: payment
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # Four streams, and the post sales stream alone left this consumer three
      # thousand events behind during a burst, which delays the refund handoff
      # that the owning case waits for.
      CONSUMER_THREADS: "12"
      # Ten connections were fully busy with 807 callers waiting while the
      # capture and refund paths held transactions open across channel calls,
      # which pushed P99 of payment intent creation to five seconds.
      HIKARI_MAX_POOL_SIZE: "32"
    # JVM event consumer on 4 streams. 512Mi is not enough at
    # MaxRAMPercentage=70 -- see the note on defaults.resources. The CPU limit
    # goes with CONSUMER_THREADS above: 4 threads do not fit in 500m, and
    # starving them makes the HTTP thread miss its probe timeout.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '4', memory: 4Gi }
  provider-integration:
    db: provider_integration
    # Two replicas: the provider reservation is a saga step whose confirmation
    # the capacity Hold waits for.
    replicas: 2
  entitlement-ticketing:
    db: entitlement_ticketing
    # Two replicas: ticket issuance follows the reservation, and its consumer
    # group is read from a Redis stream.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      SEAT_ASSIGNMENT_BASE_URL: http://seat-assignment:8080
      # The Booking stream peaks near 150 events per second and ticket issuance
      # waits for entitlement processing; four threads fell 6.5 thousand events
      # behind during a peak.
      CONSUMER_THREADS: "8"
  fulfillment:
    db: fulfillment
    env:
      # Eight reader loops: one loop processes a read batch on its own
      # goroutine, and the entitlement projection needs a database write per
      # ticket. Measured with one loop, fulfillment processed about 37 events
      # per second while the entitlement stream published roughly 100, so the
      # stream trimmed events before they were delivered and sixteen percent of
      # the issued tickets had no fulfillment record when the load generator
      # boarded them.
      CONSUMER_WORKERS: "8"
      PG_MAX_POOL_SIZE: "24"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  post-sales:
    db: post_sales
    # Two replicas: the change and refund cases that the load generator polls
    # are executed here, and a burst left its journey order consumer ten thousand
    # events behind.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # 5 streams (journey-order, capacity-availability, dispatch,
      # ancillary-service, disruption-recovery) on one thread could not keep up:
      # the live cluster held 3522 pending messages on events:journey-order under
      # this consumer group. The visible effect was NOT a stuck consumer -- the
      # backlog drained at ~2/s -- but a timing failure downstream: a refund
      # request arriving before its order's JourneyOrderCreated had been processed
      # found no policy context, fell back to departureTime=now, and quoted a zero
      # refund. See the MISS/HIT logging in PostSalesApplicationService.
      # Twelve rather than four: change and refund cases must finish inside the
      # load generator polling window, and during a peak the case backlog grew
      # until the window expired.
      # Twenty four: a burst still left this consumer, which reads the Journey
      # Order stream for case context, ten thousand events behind, and the case
      # operations that wait for that context then missed the poll window.
      CONSUMER_THREADS: "24"
      # Leave database connections for HTTP requests and the outbox relay.
      HIKARI_MAX_POOL_SIZE: "32"
    # CPU headroom covers concurrent post-sales requests and event processing.
    resources:
      requests: { cpu: 500m, memory: 256Mi }
      limits: { cpu: '6', memory: 4Gi }
  notification:
    db: notification
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      SMTP_URL: smtp://mailpit:1025
      SMTP_MAX_CONNECTIONS: "32"
      CONSUMER_BATCH_CONCURRENCY: "16"
      PG_MAX_POOL_SIZE: "48"
      # 11 streams. Also had ~1000 pending messages against one thread, which is
      # why e2e assertions on NotificationScheduled/NotificationDelivered timed
      # out intermittently.
      CONSUMER_THREADS: "4"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '2', memory: 3Gi }
  traveler-profile:
    db: traveler_profile
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # One subscriber thread could not follow the identity verification stream
      # during a peak, which delayed the traveler snapshot that Offer Management
      # requires before it can create an offer.
      CONSUMER_THREADS: "8"
      # Ten pooled connections with hundreds of waiting callers produced
      # `Connection is not available, request timed out after 15000ms` and three
      # thousand timed out traveler creations in four minutes.
      HIKARI_MAX_POOL_SIZE: "40"
    # JVM event consumer -- see the note on defaults.resources.
    #
    # 4 cores: measured at 96.3% of a 500m limit over a full envelope, so the
    # reading was the ceiling rather than the demand.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '6', memory: 3Gi }
  risk-compliance:
    db: risk_compliance
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  corporate-travel:
    db: corporate_travel
  account:
    db: account
  loyalty-membership:
    db: loyalty_membership
    env:
      CONSUMER_BATCH_CONCURRENCY: "4"
      PG_MAX_POOL_SIZE: "24"
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  admin-audit:
    db: admin_audit
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: '1', memory: 2Gi }
  customer-service:
    db: customer_service
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # The TypeScript kit has no CONSUMER_THREADS support: the effective knob
      # is the parallel handler count per read batch. Four handlers kept up at
      # troughs only, and this consumer fell thirteen seconds behind on the
      # identity verification stream while a peak held near one hundred and
      # sixty events per second.
      # A burst then produced five hundred to seven hundred identity events per
      # second and this consumer plateaued near five hundred.
      CONSUMER_BATCH_CONCURRENCY: "48"
      # The pool covers the thirty two handlers without widening the total
      # connection count that decides whether a rollout fits.
      PG_MAX_POOL_SIZE: "48"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    #
    # 1 core was itself binding: measured at 99.9% of the limit with a client p99
    # of 808ms on timeline projections that do no real work.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '4', memory: 3Gi }
  finance-settlement:
    db: finance_settlement
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # Eight rather than four: revenue recognition has to finish inside the
      # invoice polling window, and four threads could not follow the payment and
      # booking streams at peak.
      # Twenty four: eight threads read the seven streams at 75 to 106 events per
      # second while the booking stream alone produced 150 to 230, and the lag
      # grew from thirteen seconds to fifty seven within a minute.
      CONSUMER_THREADS: "24"   # 7 streams
      HIKARI_MAX_POOL_SIZE: "48"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '6', memory: 4Gi }
  reporting:
    db: reporting
    env:
      # Twelve rather than four: the projection consumer still reached ten
      # thousand events of lag on the Journey Order stream at a burst, and its
      # CPU sat at 2.6 of the four core limit while it did.
      REPORTING_CONSUMERS_PER_STREAM: "12"
      WEB_CONCURRENCY: "2"
      # Eight rather than four: the projection consumer fell 3.6 thousand events
      # behind on the journey order stream during a peak.
      CONSUMER_THREADS: "8"
    # Event ingestion and background projection refresh share this CPU budget.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '8', memory: 6Gi }
  supplier-catalog:
    db: supplier_catalog
  waitlist:
    db: waitlist
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      MIGRATIONS_DIR: /app/migrations
      FARE_PRICING_BASE_URL: http://fare-pricing:8080
      OFFER_MANAGEMENT_BASE_URL: http://offer-management:8080
      JOURNEY_ORDER_BASE_URL: http://journey-order:8080
      # Same TypeScript kit as ancillary service: the parallel handler count per
      # read batch is the effective consumer concurrency. This consumer fell
      # 2619 events behind on the Journey Order stream at a burst.
      CONSUMER_BATCH_CONCURRENCY: "8"
      PG_MAX_POOL_SIZE: "24"
  wallet-promotion:
    db: wallet_promotion
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: '1', memory: 2Gi }
  disruption-recovery:
    db: disruption_recovery
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      POST_SALES_URL: http://post-sales:8080
      WALLET_PROMOTION_URL: http://wallet-promotion:8080
      TRANSFER_MANAGEMENT_URL: http://transfer-management:8080
  transfer-management:
    db: transfer_management
    env:
      DISRUPTION_RECOVERY_URL: http://disruption-recovery:8080
      PLACE_NETWORK_URL: http://place-network:8080
  seat-assignment:
    db: seat_assignment
    # Two replicas: the seat allocation runs once per issued ticket and its
    # consumers read the capacity stream.
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
  payment-channel:
    db: payment_channel
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    # Statements retain their line arrays in JSON snapshots.
    # Growth and reconciliation acceptance are tracked in docs/TODO.md, T08.
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: '2', memory: 3Gi }
  invoicing:
    db: invoicing
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    terminationGracePeriodSeconds: 45
    lifecycle:
      preStop:
        exec:
          command: ["sleep", "10"]
    env:
      # Each event stream has its own subscriber and entity projections use row locks.
      CONSUMER_THREADS: "1"
      # The pool must cover the consumer threads plus the HTTP handlers plus the
      # outbox relay, all of which contend at startup. rust-kit defaults to 10
      # with a 5s acquire_timeout, and 4 consumer threads did not fit: invoicing
      # panicked during startup with SubscribeFailed("pool timed out while waiting
      # for an open connection"). Postgres itself was nowhere near its ceiling
      # (101 of 500 connections), so this is per-service pool sizing, not a
      # server limit.
      PG_MAX_POOL_SIZE: "25"
    # 4 consumer threads do not fit in the default 500m CPU limit. Raising
    # CONSUMER_THREADS without raising this caused a CrashLoopBackOff: the
    # threads saturated half a core working through the backlog, the HTTP thread
    # could not answer /healthz within the probe timeout, and kubelet restarted
    # the pod every 64 seconds. Threads and CPU must be raised together.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: '2', memory: 3Gi }
  marketing-campaign:
    db: marketing_campaign
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: '1', memory: 2Gi }
  group-booking:
    db: group_booking
    # JVM event consumer, low traffic -- see the note on defaults.resources.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: '1', memory: 2Gi }
  travel-insurance:
    db: travel_insurance
    # Go, not JVM, so MaxRAMPercentage in defaults.env does nothing here.
    # Untuned the Go runtime sizes the heap against total machine memory and
    # ignores the cgroup limit, so GOMEMLIMIT must be set with the limit, at
    # ~85% of it. Change the two together.
    #
    # CPU raised off 250m for the same reason as defaults.resources: measured at
    # 100% of its limit under the shaped profile, with a client p99 of 2.6s on a
    # service whose own work is trivial. Memory stays at 512Mi -- peak working
    # set is well under it, so only the CPU ceiling was binding, and GOMEMLIMIT
    # therefore does not move.
    #
    # 4 cores and 2Gi: over a full envelope it peaked at 0.97 of a 1-core
    # limit, which is the limit and therefore not a measurement. GOMEMLIMIT
    # moves with the memory ceiling, as the note above requires.
    env:
      GOMEMLIMIT: "1740MiB"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: '4', memory: 3Gi }

# -- Per-service overrides ---------------------------------------------------
# Example:
#   services:
#     journey-order:
#       replicas: 2
#       pgInstance: hot          # key of postgres.instances
#       resources:
#         requests: { cpu: 200m, memory: 256Mi }
#         limits: { memory: 512Mi }
#       probes:
#         startup: false         # drop the startupProbe for this service
#         startupFailureThreshold: 24
