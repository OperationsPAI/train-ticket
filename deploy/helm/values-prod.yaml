          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '4'
          memory: 8Gi
    user:
      databases:
      - account
      - traveler_profile
      - identity_verification
      maxConnections: 600
      sharedBuffers: 1GB
      workMem: 16MB
      resources:
