# Values for the local kind integration cluster.
#
# The chart defaults target a real cluster (opspai/*:latest pulled from a
# registry, a named StorageClass). kind is different in two ways that matter:
#
#   1. Images are built locally by deploy/build-images.sh and side-loaded with
#      `kind load docker-image`, so they are tagged train-ticket/<svc>:local and
#      exist only on the node. imagePullPolicy MUST stay IfNotPresent or the
#      kubelet will try to pull a tag that no registry serves.
#   2. kind ships a single `standard` StorageClass (local-path provisioner).
#      Note it is hostPath-backed and does NOT enforce the requested size, so a
#      PVC request here is a declaration of intent, not a cap -- for Jaeger the
#      TTL is the only hard bound. See docs/07-observability/README.md.
#
# Resource limits are deliberately generous rather than minimal. This node has
# ~62Gi and only a few cores committed, and being frugal has already cost three
# OOMKills (Redis x3 at 256Mi, Postgres x2 at 512Mi, Jaeger x13 at 256Mi) plus
# one connection-exhaustion outage. Headroom is cheaper than another one.

global:
  imageOrg: train-ticket
  imageTag: local
  imagePullPolicy: IfNotPresent

postgres:
  storage:
    storageClass: standard
  instances:
    core:
      # 500 connections is the sizing constraint, not an aspiration: a rolling
      # restart holds old and new pods' pools concurrently, so the steady-state
      # count roughly doubles for the duration. 250 was not enough and Postgres
      # started refusing connections mid-deploy.
      maxConnections: 500
      sharedBuffers: 1GB
      workMem: 8MB
      # Both ceilings were binding, and this is the scope where that contaminates
      # everything: the shared store couples services that share nothing else, so
      # a limit here shows up as latency at every caller at once. Measured under
      # the shaped open-loop profile at 100% of the 4-core limit with a peak
      # working set of 3709 MiB against 4Gi -- 91% of the cgroup bound.
      #
      # shared_buffers stays at 1GB deliberately. The memory that filled the old
      # ceiling was connection-local (500 clients x 8MB work_mem), so enlarging
      # the shared cache would take it from the thing that actually needed it.
      #
      # 8 cores and 8Gi were binding in turn: measured p50 4.596 cores, p95
      # 7.811 and peak 8.003 against the 8-core limit, with a peak working set
      # of 7482 MiB against 8Gi -- 91% of the cgroup bound, the same fraction
      # that made the 4Gi ceiling an OOM risk. This is persistent load rather
      # than a burst, and it is the one scope where a ceiling contaminates every
      # measurement at once.
      resources:
        requests: { cpu: 500m, memory: 2Gi }
        limits: { cpu: '12', memory: 12Gi }

redis:
  maxmemory: 3gb
  maxmemoryPolicy: noeviction
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: '2', memory: 4Gi }

jaeger:
  storage:
    storageClass: standard

# Telemetry store. kind's local-path provisioner does NOT enforce the requested
# size (it is hostPath-backed), so clickhouse.ttl is the only real bound on how
# much disk this uses -- the PVC request is a declaration of intent.
clickhouse:
  storage:
    storageClass: standard

prometheus:
  storage:
    storageClass: standard
