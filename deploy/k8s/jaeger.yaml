apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          args:
            - --memory.max-traces=20000
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: jaeger-otlp
              containerPort: 4317
            - name: ui
              containerPort: 16686
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: jaeger-otlp
      port: 4317
      targetPort: jaeger-otlp
    - name: ui
      port: 16686
      targetPort: ui
  selector:
    app.kubernetes.io/name: jaeger
