# Load generator configuration (consumed by the Go loadgen, deploy/loadgen-go).
# Mounted into the pod at /etc/loadgen/config.yaml via the hashed
# `loadgen-config` ConfigMap generated by deploy/k8s/kustomization.yaml.
# Edit THIS file, then `kubectl -n train-ticket apply -k deploy/k8s`; the
# ConfigMap hash change triggers a loadgen rollout.
#
# Every probability / weight in here is a tunable hyperparameter; the code
# never hardcodes a distribution. Weights need not sum to 1 — they are
# normalized at runtime. Unknown keys are ignored by the parser (no strict
# decoding), so a typo fails silently rather than crashing — grep the Go
# source before adding a key.

target:
  # In-cluster service DNS. {service} is substituted per call.
  base_url_template: "http://{service}:8080"
  redis_url: "redis://redis:6379"       # backoffice driver only (saga discovery)
  request_timeout_seconds: 10

run:
  # Concurrency model note: the loadgen is a single Go process using one
  # goroutine per virtual customer. There is no multiprocessing fan-out, so
  # this number is the true customer concurrency for the pod (the Python
  # implementation multiplied it by LOADGEN_PROCESSES).
  mode: closed-loop           # "closed-loop" (think-time paced) or "open-loop" (target_rps paced)
  workers: 200                # concurrent virtual customers (goroutines)
  duration_seconds: 0         # 0 = run until stopped
  seed: null                  # set an int for reproducible randomness
  think_time_seconds: { min: 0.5, max: 3.0 }   # uniform pause between steps
  session_pause_seconds: { min: 1.0, max: 5.0 } # pause between journeys
  stats_interval_seconds: 30
  state_file: "/data/loadgen-state.json"  # entity registry; "" disables persistence
  # Open-loop settings — only consulted when mode: open-loop. Arrival-rate
  # paced rather than concurrency paced.
  target_rps: 500
  ramp_duration_seconds: 30

# ---------------------------------------------------------------------------
# Journey mix — relative weights of what a virtual customer does next.
# ---------------------------------------------------------------------------
journey_mix:
  browse: 30        # search (+ maybe quote) and leave
  purchase: 40      # full funnel: traveler -> search -> quote -> offer -> order -> pay -> ticket
  refund: 8         # refund one of their own completed purchases
  change: 5         # change case on a completed purchase
  fulfillment: 7    # board + complete (or no-show) with an issued entitlement
  support: 4        # open a support case about one of their orders
  legacy: 6         # whole lifecycle through the legacy ACL facade
  ride: 5           # dispatch ride request lifecycle
  disruption: 1     # low-frequency ops disruption recovery drill
  transfer: 1        # low-frequency transfer-management drill
  loyalty: 8         # check/enroll loyalty membership tier
  insurance: 6       # travel insurance policy request
  group_booking: 5   # create group booking with members
  corporate: 5       # corporate travel agreement
  campaign: 4        # draft marketing campaign (ops-side)

# ---------------------------------------------------------------------------
# Within-journey behavior knobs.
# ---------------------------------------------------------------------------
behavior:
  # identity
  p_new_account: 0.35         # else: reuse an account from the registry (re-validated via GET)
  p_new_traveler: 0.50        # else: reuse one of the account's travelers (GET-validated)
  p_second_traveler: 0.15     # purchase for two travelers instead of one

  # funnel abandonment (customer walks away without error)
  p_abandon_after_search: 0.20
  p_abandon_after_quote: 0.15
  p_abandon_before_payment: 0.10
  p_cancel_payment_intent_on_abandon: 0.20  # subset explicitly POSTs payment-intents/{id}/cancel
  p_cancel_order_before_payment: 0.10       # subset explicitly POSTs journey-orders/{id}/cancel
  p_refund_get_after_completion: 0.50
  p_payment_channel_missed_seed: 0.01
  # Long-tail list read against payment-channel's statement projection, sampled
  # after a journey's read probe fires. Lives here (not under long_tail) so
  # personas can override it like any other behavior knob.
  p_payment_channel_read_probe: 0.10       # GET channel-statements?channel=ALIPAY_SIM
  p_ancillary_purchase: 0.03               # MEAL add-on: catalog->publish->offer->quote->select->confirm
  p_invoice_after_purchase: 0.02           # tax e-invoice branch (invoicing /api/v1/e-invoice-requests)

  # how long a customer waits for a staff-handled step (reservation,
  # ticketing, risk review) before giving up
  staff_wait_seconds: 90

  # fulfillment variant
  p_no_show: 0.15             # else: board + complete

  # legacy facade
  p_legacy_cancel: 0.30       # cancel after ticket_issue instead of boarding

  # dispatch ride branch probabilities
  ride_branches: { complete: 0.75, driver_cancel_reassign: 0.10, user_cancel: 0.10, no_show: 0.05 }

  # waitlist fallback for purchase journeys that hit NO_AVAILABLE_CAPACITY.
  # Conservative defaults: convert only some sold-out traffic and cancel rarely.
  p_waitlist_on_no_capacity: 0.30
  p_waitlist_cancel: 0.05
  disruption_option_mix: { WAIT: 0.50, REFUND: 0.35, COMPENSATION: 0.15 }
  transfer_contract_mix: { PROTECTED: 0.55, SELF_TRANSFER: 0.45 }
  p_transfer_delay: 0.35
  p_transfer_missed: 0.25
  waitlist_deadline_minutes: 30

  # sales channel weights. NOTE: fare rule sets are published per channel;
  # out of the box only WEB has published rules, so other channels will get
  # quote failures unless you publish rule sets for them first.
  channels: { WEB: 1.0 }

  # legacy seat types
  seat_types: { SECOND: 0.8, FIRST: 0.2 }

  # traveler identity pools used when creating (mock) travelers
  traveler_types: { ADULT: 0.85, CHILD: 0.10, SENIOR: 0.05 }

# ---------------------------------------------------------------------------
# Staff simulator — the platform/agent actor pool (simulated like customers).
# Staff process queues: saga reservation driving, ticket issuing, manual
# risk review, support case handling.
# ---------------------------------------------------------------------------
staff:
  # Scaled with run.workers: staff are the queue-draining side of the same
  # pipeline (saga reservation, ticketing, risk review, support cases). At 200
  # customer goroutines a 2-worker staff pool is the bottleneck and purchases
  # time out on staff_wait_seconds instead of completing.
  workers: 40
  think_time_seconds: { min: 0.5, max: 2.0 }   # agent reaction time
  queue_poll_seconds: 0.5
  p_risk_approve: 0.50        # manual review lifts the block, else rejected
  p_support_assign: 0.80
  p_support_resolve: 0.60
  p_support_assign_resolve_branch: 0.70     # existing assign/resolve path
  p_support_classify_escalate_branch: 0.15  # classify -> assign -> escalate lifecycle coverage
  p_support_classify_close_branch: 0.15     # classify -> close, optionally reopen -> close
  p_support_reopen_after_close: 0.10        # only after the classify/close branch
  p_seat_preferences: 0.03    # staff ticketing attaches a seatPreferences block

# ---------------------------------------------------------------------------
# Long-tail probes — conservative low-frequency coverage for read endpoints.
# Reads are attached to real entities just produced by normal journeys; ID
# mismatches are counted in errors. Disable with enabled: false.
#
# These probe REAL ids (order, offer, entitlement, ancillary catalog/offer/
# order-item, invoice title/request/e-invoice, wallet account/benefit, ...)
# carried out of the journey that created them, not synthetic ids — that is
# what makes them exercise the cache-cold read and projection-lag paths rather
# than just the 404 branch.
# ---------------------------------------------------------------------------
long_tail:
  enabled: true
  p_read_probe_after_journey: 0.05
  p_ancillary_read_probe: 0.20

# ---------------------------------------------------------------------------
# Operations-side actor — runs every few minutes and drives read-only reporting
# and finance queries plus very low-frequency supplier-catalog master-data writes.
# Idempotency keys are generated per command by the API client (UUIDv7).
# ---------------------------------------------------------------------------
ops:
  enabled: true
  interval_seconds: { min: 180, max: 420 }
  dashboard_id: dash-revenue
  p_supplier_catalog_write: 0.25
  p_wallet_manual_issue: 0.20
  wallet_manual_issue_minor_units: 100

# ---------------------------------------------------------------------------
# Bootstrap — ops-side inventory guarantees (NOT customer actions). Runs once
# at startup; idempotent. Ensures searches can actually find trips.
# ---------------------------------------------------------------------------
bootstrap:
  enabled: true
  # city pool drawn from in order; places/nodes are created only if a place
  # with the same code is not already registered (discovered via list API).
  cities:
    - { name: Beijing,  code: BJS }
    - { name: Shanghai, code: SHA }
    - { name: Guangzhou, code: CAN }
    - { name: Hangzhou, code: HGH }
  # Rolling departure window: services are ensured for each day in
  # [T+from_days, T+to_days] (computed at startup from today's date).
  # For backward compat, if departure_dates is present it takes precedence.
  departure_window:
    from_days: 7      # T+7
    to_days: 21       # T+21  (2-week window)
  services_per_date: 3
  service_number_base: 5000    # G<base+n> to avoid clashing with e2e's G1234
  # Route-discovery floor: if fewer than this many bookable routes verify,
  # bootstrap runs an extra discovery sweep over known places. Previously
  # implicit (code default 2); made explicit for visibility.
  min_routes: 2

# ---------------------------------------------------------------------------
# Default monetary / domain values — read by journey providers so nothing
# is hardcoded in the loadgen source.
# ---------------------------------------------------------------------------
defaults:
  currency: "CNY"
  # NOTE: inert in BOTH implementations, not a migration regression. The Python
  # loadgen read this into a local and then never sent it; travel-insurance
  # /api/v1/policies accepts no premium field. Retained as documentation of the
  # intended figure.
  insurance_premium_minor: 50000
  group_fare_minor: 85000
  group_discount_basis_points: 500
  corporate_credit_limit_minor: 5000000

# ---------------------------------------------------------------------------
# Scalper simulator — ticket scalper (黄牛) actor. Zero think time, multi-
# account pool rotation, retry-storm on failure, hot-segment targeting.
# ---------------------------------------------------------------------------
scalper:
  enabled: true
  workers: 3                   # concurrent scalper workers
  accounts_per_worker: 5       # pre-registered account pool per worker
  target_segments: 2           # grab from the first N bootstrap segments
  retry_on_failure: 0.8        # probability of immediate retry on step failure
  retry_same_key: true         # reuse the same Idempotency-Key on retry
  purchase_batch_size: 4       # attempts per tight loop before micro-pause
  # Burst timing. Previously implicit (both implementations defaulted these
  # internally); made explicit so the retry-storm shape is visible and
  # tunable rather than buried in code defaults.
  burst_gap_ms: 50             # micro-pause between batches
  slowdown_probability: 0.12   # chance of a human-like pause mid-storm
  slowdown_min_ms: 250
  slowdown_max_ms: 1600

# Poll tuning for asynchronous state (saga completion, order confirmation).
polling:
  attempts: 20
  interval_seconds: 4

# Wallet benefit branch of the purchase journey: issue a promotion credit for
# the buying account, then reserve and redeem it. The reserve/redeem
# transitions are exercised ONLY here — ops.p_wallet_manual_issue below issues
# and reads back a benefit but never redeems one.
wallet_promotion:
  p_purchase_reserve_redeem: 0.02
  purchase_benefit_minor_units: 100

# Waitlist poll budget. Overrides the global polling.* above for waitlist
# requests only, so a sold-out purchase releases its worker sooner.
waitlist:
  poll_attempts: 8
  poll_interval_seconds: 4

# ---------------------------------------------------------------------------
# Per-request outcome records (issue #420).
#
# One JSON Lines row per client HTTP request: start timestamp, journey/chain,
# step, target service, method, route template + raw path, status, latency ms,
# a transport-error marker for requests that never got a status, and the trace
# id the request carried. The aggregate `[stats]` snapshot is UNCHANGED — this
# is additional output, not a replacement.
#
# Why: the snapshot keeps a rolling 5000-sample latency buffer per service, so
# a spike that has scrolled out of the buffer is unrecoverable and a quantile
# nobody asked for before the run cannot be computed afterwards. With one row
# per request, a finished run can be re-sliced by endpoint/journey/sub-window
# and each row joined to its server-side spans in Jaeger by trace id.
#
# The path MUST live under the /data volume mounted by deploy/k8s/loadgen.yaml
# — anywhere else and the file dies with the container's writable layer.
# /data is an emptyDir, so it survives container restarts but not pod
# deletion; copy the file out before deleting the pod:
#   kubectl -n train-ticket cp \
#     "$(kubectl -n train-ticket get pod -l app.kubernetes.io/name=loadgen \
#         -o jsonpath='{.items[0].metadata.name}')":/data/requests.jsonl \
#     ./requests.jsonl
#
# Load-neutrality: request goroutines only do a NON-BLOCKING send onto a
# buffered channel. All formatting, JSON encoding and file I/O happens on one
# dedicated writer goroutine, so disk latency can never back-pressure into the
# offered RPS. If the writer falls behind, records are dropped and counted
# (reported on the `[recorder]` line) rather than allowed to slow requests
# down. See the comment block at the top of deploy/loadgen-go/recorder.go.
# ---------------------------------------------------------------------------
recording:
  enabled: true
  path: /data/requests.jsonl   # must be under the /data volume (loadgen.yaml)
  buffer_records: 65536        # hand-off channel depth; full => drop + count
  flush_interval_seconds: 2    # bounds how stale the on-disk tail can be
  max_file_megabytes: 512      # at the cap, rename to <path>.1 and start fresh
  # Fraction of requests whose traceparent carries the sampled flag (flags=01).
  # 1.0 by default and deliberately so: the loadgen ORIGINATES these traces, so
  # it owns the sampling decision. With flags=00 a conformant service records
  # no span, and the trace id in the record file would point at nothing in
  # Jaeger — which is the one thing this feature exists to prevent. Lower this
  # only to shed tracing-backend volume; rows then carry `sampled: false` so an
  # analysis can tell "no span was ever recorded" from "the span is missing".
  trace_sampled_ratio: 1.0

# ---------------------------------------------------------------------------
# Personas — probability overlays on top of global behavior.  Each worker
# iteration picks a persona based on weight, then merges its overrides into
# the active behavior context.  No persona-specific code paths — behavior
# differences come purely from probability values.  Omit this section (or
# leave empty) for backward compat: the global behavior + journey_mix act
# as a single implicit persona.
# ---------------------------------------------------------------------------
# personas:
#   casual:
#     weight: 60
#     journey_weights: {browse: 40, purchase: 30, refund: 8, support: 4, loyalty: 5, insurance: 3}
#     overrides:
#       p_new_account: 0.35
#       p_abandon_after_search: 0.30
#       think_time: {min: 2, max: 8}
#   business:
#     weight: 25
#     journey_weights: {purchase: 50, change: 15, corporate: 10, loyalty: 10}
