---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: dispatch
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: dispatch
          image: train-ticket/dispatch:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_URL
              value: redis://redis.train-ticket.svc.cluster.local:6379
            - name: DATABASE_URL
              value: postgresql://trainticket:trainticket-dev@postgres:5432/dispatch
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: dispatch
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: dispatch
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: dispatch
---
