apiVersion: apps/v1
kind: Deployment
metadata:
  name: place-network
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: place-network
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  # In-memory phase-1 stores: never run two generations concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: place-network
  template:
    metadata:
      labels:
        app.kubernetes.io/name: place-network
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: place-network
          image: train-ticket/place-network:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_URL
              value: redis://redis.train-ticket.svc.cluster.local:6379
            - name: DATABASE_URL
              value: postgresql://trainticket:trainticket-dev@postgres:5432/place_network
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: place-network
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: place-network
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: place-network
---
