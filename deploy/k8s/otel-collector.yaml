apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
data:
  # Copied from platform/observability/otel-collector.yaml, which is the
  # canonical collector config for local compose and kind. Keep synchronized.
  otel-collector.yaml: |
    # Canonical collector config for local compose and the kind deployment.
    # Keep deploy/k8s/otel-collector.yaml ConfigMap data synchronized with this file
    # until the k8s overlay can consume this file directly as its single source.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 96
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      telemetry:
        logs:
          level: info
      extensions:
        - health_check
        - zpages
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.103.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: zpages
              containerPort: 55679
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health
      port: 13133
      targetPort: health
  selector:
    app.kubernetes.io/name: otel-collector
