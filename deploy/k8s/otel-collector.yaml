apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
data:
  # Copied from platform/observability/otel-collector.yaml, which is the
  # canonical collector config for local compose and kind. Keep synchronized.
  otel-collector.yaml: |
    # Canonical collector config for local compose and the kind deployment.
    # Keep deploy/k8s/otel-collector.yaml ConfigMap data synchronized with this file
    # until the k8s overlay can consume this file directly as its single source.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        # Kept in sync with platform/observability/otel-collector.yaml. Must stay
        # above the sending_queue below: a limiter smaller than the queue makes
        # the collector refuse spans it could buffer.
        limit_mib: 768
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      debug:
        verbosity: basic
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
        # The trace store is now a stateful, restartable component: it holds an
        # exclusive lock on its Badger volume, so a restart takes it offline for
        # a few seconds. Retry plus a bounded queue means spans emitted during
        # that window are redelivered instead of dropped on the floor.
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 4000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      telemetry:
        logs:
          level: info
      extensions:
        - health_check
        - zpages
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
            - otlp/jaeger
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.103.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: zpages
              containerPort: 55679
            - name: metrics
              containerPort: 8888
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health
      port: 13133
      targetPort: health
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: zpages
      port: 55679
      targetPort: zpages
  selector:
    app.kubernetes.io/name: otel-collector
