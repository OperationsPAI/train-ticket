# Idempotent database bootstrap.
#
# Guarantees every database named by a DATABASE_URL in services.yaml exists,
# on every apply, without depending on PGDATA being empty. See the header of
# deploy/k8s/db-bootstrap.sh for why that matters.
#
# Why a Job and not an initContainer on postgres: an initContainer runs before
# postgres itself starts, so it could not connect to it. Why not a sidecar:
# a sidecar's failure does not surface as a discrete "this deploy step failed".
# A Job has a terminal success/failure that `kubectl wait` can block on, which
# is what makes `make deploy` able to stop before seeding against a stack that
# is missing databases.
---
apiVersion: batch/v1
kind: Job
metadata:
  # The name carries no hash: `make deploy` deletes the previous Job before
  # applying, because a completed Job's pod template is immutable and a plain
  # re-apply of a changed template would be rejected by the API server.
  name: db-bootstrap
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: db-bootstrap
    app.kubernetes.io/part-of: train-ticket
spec:
  # A failure here means services will crash-loop on connect, so retry a couple
  # of times (covers postgres restarting mid-run) but then stop and stay
  # visibly Failed rather than retrying forever behind the scenes.
  backoffLimit: 3
  # Bounded so a hung run cannot hold up a deploy indefinitely; comfortably
  # above the script's own 300s postgres wait.
  activeDeadlineSeconds: 600
  # Keep finished Jobs around for an hour: `kubectl logs job/db-bootstrap` is
  # the first thing to check when a service cannot reach its database.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
        app.kubernetes.io/part-of: train-ticket
    spec:
      restartPolicy: Never
      containers:
        - name: db-bootstrap
          # Same image as the server, so psql's major version always matches
          # and no extra image has to be built or loaded into kind.
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/db-bootstrap.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: MANIFEST
              value: /manifests/services.yaml
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: manifests
              mountPath: /manifests
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # Both ConfigMaps are generated by kustomize from the real files, so
        # the Job always reads the same services.yaml that was just applied --
        # that is what makes the manifest the single source of truth for the
        # database list rather than a copy of it.
        - name: scripts
          configMap:
            name: db-bootstrap-scripts
            defaultMode: 0755
        - name: manifests
          configMap:
            name: db-bootstrap-manifests
