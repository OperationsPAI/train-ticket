    SELECT 'CREATE DATABASE trip_planning'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'trip_planning')\gexec
    SELECT 'CREATE DATABASE waitlist'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'waitlist')\gexec
    SELECT 'CREATE DATABASE wallet_promotion'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wallet_promotion')\gexec
    SELECT 'CREATE DATABASE dispatch'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'dispatch')\gexec
    SELECT 'CREATE DATABASE disruption_recovery'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'disruption_recovery')\gexec
    SELECT 'CREATE DATABASE transfer_management'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'transfer_management')\gexec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: train-ticket
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Postgres is the system of record for all 38 services, so an OOMKill
          # here is materially worse than the Redis one (Redis is transport-only
          # and recovers from the outbox). It was OOMKilled twice on the stock
          # settings: shared_buffers defaulted to 160Mi inside a 512Mi limit,
          # leaving ~350Mi for up to 500 backends at 4Mi work_mem each. With 180
          # live connections that is arithmetically unsurvivable.
          #
          # 2Gi limit with shared_buffers at 25% of it (the standard ratio).
          #
          # max_connections stays at 500. It was briefly cut to 250 on the
          # reasoning that 38 services x ~5 pooled connections plus headroom
          # would fit -- but 250 was sized against a 180-connection observation
          # taken while the loadgen was still warming up. A rolling restart runs
          # old and new pods concurrently, so every service's pool is
          # transiently doubled, and the namespace blew straight past 250:
          # Postgres started refusing with "sorry, too many clients already",
          # which broke transactions mid-flight and stopped identity-verification
          # publishing its outbox events at all. The memory to back 500 is now
          # actually there (2Gi, up from 512Mi), which was the real problem.
          args:
            - postgres
            - -c
            - shared_buffers=512MB
            - -c
            - max_connections=500
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=128MB
            - -c
            - effective_cache_size=1GB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - trainticket
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-initdb
          configMap:
            name: postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: train-ticket
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres
