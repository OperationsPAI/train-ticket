# Load generator — managed by deploy/k8s kustomize.
#   start/update: kubectl -n train-ticket apply -k deploy/k8s
#   tune:         edit deploy/loadgen/config.yaml, then apply -k; the ConfigMap hash triggers a rollout
#   pause:        kubectl -n train-ticket scale deploy/loadgen --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: train-ticket
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: train-ticket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: train-ticket
    spec:
      containers:
        - name: loadgen
          image: train-ticket/loadgen:local
          imagePullPolicy: IfNotPresent
          env:
            - name: LOADGEN_CONFIG
              value: /etc/loadgen/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/loadgen
              readOnly: true
            - name: state
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: loadgen-config
        - name: state
          emptyDir: {}   # registry survives container restarts, not pod deletion
