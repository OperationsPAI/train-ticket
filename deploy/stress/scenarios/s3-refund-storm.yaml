# S3 — Refund Storm: concurrent refunds on the same batch of orders.
#
# Pre-condition: run S1 or S2 first to create purchased orders.
# This scenario takes existing purchases and refunds them concurrently,
# including duplicate submissions and refund+change races.

name: s3-refund-storm
description: "Concurrent refunds on batch of orders + duplicate submissions"

load:
  model: closed
  workers: 15
  duration_seconds: 100
  rps: null

target:
  base_url_template: "http://{service}:8080"
  redis_url: "redis://redis:6379"
  request_timeout_seconds: 15

mix:
  purchase: 0.0
  refund: 1.0
  browse: 0.0

constraints:
  p_duplicate_refund: 0.10
  p_change_race: 0.05

seed:
  cities: ["Beijing", "Shanghai"]
  departure_date: "2026-09-01"
  purchase_report: "/tmp/s3-seed-report.json"

polling:
  attempts: 8
  interval_seconds: 2

staff:
  workers: 4
  think_time_seconds: {min: 0.1, max: 0.3}
  queue_poll_seconds: 0.2
  p_risk_approve: 1.0
