# S5 — Retry Storm: S2-like load + 30% client retries with same Idempotency-Key.
#
# Validates that every idempotency key produces exactly one effect row.

name: s5-retry-storm
description: "Steady load + 30% client retries (same idempotency key)"

load:
  model: closed
  workers: 15
  duration_seconds: 90
  rps: null

target:
  base_url_template: "http://{service}:8080"
  redis_url: "redis://redis:6379"
  request_timeout_seconds: 15

mix:
  purchase: 0.70
  refund: 0.10
  browse: 0.20

constraints:
  p_client_retry: 0.30
  retry_same_key: true

seed:
  cities: ["Beijing", "Shanghai"]
  departure_date: "2026-09-01"

polling:
  attempts: 8
  interval_seconds: 2

staff:
  workers: 4
  think_time_seconds: {min: 0.1, max: 0.3}
  queue_poll_seconds: 0.2
  p_risk_approve: 1.0
