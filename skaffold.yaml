apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: train-ticket

# Artifact names are BARE -- `account`, not `opspai/account`. The registry comes
# from `--default-repo`, and how it combines with the artifact name is what
# decides whether this file can serve both targets:
#
#   opspai/account  -d mirrors.tencent.com/microservice
#     -> mirrors.tencent.com/microservice/opspai_account   (prefix flattened in)
#   account         -d mirrors.tencent.com/microservice
#     -> mirrors.tencent.com/microservice/account
#
# So a prefix written here is not a default that a flag overrides, it is part of
# the repository name forever after. Bare names put the whole registry choice on
# the flag: `-d opspai` for Docker Hub, `-d mirrors.tencent.com/microservice`
# for the cluster, one artifact list for both.
#
# It also makes the setValueTemplates mapping below mechanical. The variable
# suffix is the artifact name with `/ - . :` replaced by `_`, so `account` is
# IMAGE_FULLY_QUALIFIED_account; with the prefix every one of the 39 would carry
# a leading `opspai_`.
# Keep skaffold's run-id OFF the pod template.
#
# By default skaffold stamps `skaffold.dev/run-id: <uuid>` onto every resource it
# deploys, pod template included, and the uuid is new on every invocation. That
# makes the pod spec differ every run, so all 46 workloads roll whether or not
# anything was rebuilt -- which is the exact behaviour the inputDigest tagger
# below exists to avoid. Measured: two consecutive runs with no source change
# produced manifests differing in nothing but this label, and every pod
# restarted.
#
# An explicit allow list replaces the default, so the label is written only where
# named here: the Deployment's own metadata, never `.spec.template`. Skaffold
# still finds its resources -- status check reads the release it just deployed --
# and Helm's own `app.kubernetes.io/managed-by: Helm` is what actually tracks
# ownership.
#
# Image rewriting is not listed because this config does not use it: images reach
# the chart through the deploy stage's setValueTemplates, as helm values, not by
# patching rendered manifests.
resourceSelector:
  allow:
    - groupKind: Deployment.apps
      labels: [".metadata.labels"]
    - groupKind: StatefulSet.apps
      labels: [".metadata.labels"]
    - groupKind: DaemonSet.apps
      labels: [".metadata.labels"]

build:
  platforms: ["linux/amd64"]
  # Tag by CONTENT, not by commit. The default gitCommit tagger gives all 39
  # artifacts one tag and appends `-dirty` once however many files changed, so
  # two different builds of a dirty tree are indistinguishable -- and that is
  # exactly the failure Makefile:191 describes: "the manifests pin :local, so a
  # rebuild leaves the pod spec byte-identical and helm reports the release
  # unchanged -- the running pods keep the OLD image forever". `make deploy-roll`
  # restarting all 39 deployments is the workaround for it.
  #
  # inputDigest hashes each artifact's own inputs, so a changed service gets a
  # changed tag, a changed pod spec, and a rollout Helm performs by itself,
  # while the other 38 render byte-identically and are left alone. The rollout
  # step stops being something anybody has to remember.
  tagPolicy:
    inputDigest: {}
  local:
    concurrency: 8
    push: true
    useDockerCLI: true
  artifacts:
    - image: account
      context: .
      docker:
        dockerfile: deploy/docker/account/Dockerfile
    - image: admin-audit
      context: .
      docker:
        dockerfile: deploy/docker/admin-audit/Dockerfile
