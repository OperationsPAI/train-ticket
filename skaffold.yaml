# There is no deploy stage at the top level, so `skaffold build` builds and
# pushes and installs nothing. Installing is a profile, because the two things
# this repository deploys are different releases with different value layers and
# neither is a default worth running by accident.
#
# NOTE: the artifact list above is exactly the chart's rendered image set (39
# images: 38 services plus loadgen), so nothing here builds an image no
# deployment consumes. The one leftover is on the other side:
# deploy/docker/trip-planning-rs/Dockerfile is byte-identical to
# deploy/docker/trip-planning/Dockerfile (both compile the Rust crate
# services/trip-planning-rs) and is referenced by neither the chart nor this
# file. See deploy/KNOWN-ISSUES.md.
profiles:
  # The resident deployment: the one release that stays up, and the fault-free
  # reference every case is read against.
  #
  #   skaffold run -p resident -d mirrors.tencent.com/microservice
  #
  # builds only what changed, pushes it, upgrades the release and waits. No
  # rollout restart: the image tag moved, so the pod spec moved.
  #
  # The three valuesFiles are the same three, in the same order, that install
  # this release today. setValueTemplates carries image references and nothing
  # else -- deploy/helm/values-case.yaml argues that a deployer adding flags on
  # top of the branch puts half the desired state where a reader of the branch
  # cannot see it, and that holds for configuration. A content digest of a build
  # is the one fact a branch structurally cannot contain.
  - name: resident
    deploy:
      helm:
        releases:
          - name: train-ticket
            chartPath: deploy/helm/train-ticket
            namespace: train-ticket
            createNamespace: true
            wait: true
            valuesFiles:
              - deploy/helm/values-cluster.yaml
              - deploy/helm/values-case.yaml
              - deploy/helm/values-resident.yaml
            setValueTemplates:
              services.account.image: "{{.IMAGE_FULLY_QUALIFIED_account}}"
              services.admin-audit.image: "{{.IMAGE_FULLY_QUALIFIED_admin_audit}}"
              services.ancillary-service.image: "{{.IMAGE_FULLY_QUALIFIED_ancillary_service}}"
              services.booking-orchestration.image: "{{.IMAGE_FULLY_QUALIFIED_booking_orchestration}}"
              services.capacity-availability.image: "{{.IMAGE_FULLY_QUALIFIED_capacity_availability}}"
              services.corporate-travel.image: "{{.IMAGE_FULLY_QUALIFIED_corporate_travel}}"
              services.customer-service.image: "{{.IMAGE_FULLY_QUALIFIED_customer_service}}"
              services.dispatch.image: "{{.IMAGE_FULLY_QUALIFIED_dispatch}}"
              services.disruption-recovery.image: "{{.IMAGE_FULLY_QUALIFIED_disruption_recovery}}"
              services.entitlement-ticketing.image: "{{.IMAGE_FULLY_QUALIFIED_entitlement_ticketing}}"
              services.fare-pricing.image: "{{.IMAGE_FULLY_QUALIFIED_fare_pricing}}"
              services.finance-settlement.image: "{{.IMAGE_FULLY_QUALIFIED_finance_settlement}}"
              services.fulfillment.image: "{{.IMAGE_FULLY_QUALIFIED_fulfillment}}"
              services.group-booking.image: "{{.IMAGE_FULLY_QUALIFIED_group_booking}}"
              services.identity-verification.image: "{{.IMAGE_FULLY_QUALIFIED_identity_verification}}"
              services.invoicing.image: "{{.IMAGE_FULLY_QUALIFIED_invoicing}}"
              services.journey-order.image: "{{.IMAGE_FULLY_QUALIFIED_journey_order}}"
              services.legacy-acl.image: "{{.IMAGE_FULLY_QUALIFIED_legacy_acl}}"
              services.loyalty-membership.image: "{{.IMAGE_FULLY_QUALIFIED_loyalty_membership}}"
              services.marketing-campaign.image: "{{.IMAGE_FULLY_QUALIFIED_marketing_campaign}}"
              services.notification.image: "{{.IMAGE_FULLY_QUALIFIED_notification}}"
              services.offer-management.image: "{{.IMAGE_FULLY_QUALIFIED_offer_management}}"
              services.payment.image: "{{.IMAGE_FULLY_QUALIFIED_payment}}"
              services.payment-channel.image: "{{.IMAGE_FULLY_QUALIFIED_payment_channel}}"
              services.place-network.image: "{{.IMAGE_FULLY_QUALIFIED_place_network}}"
              services.post-sales.image: "{{.IMAGE_FULLY_QUALIFIED_post_sales}}"
              services.provider-integration.image: "{{.IMAGE_FULLY_QUALIFIED_provider_integration}}"
              services.reporting.image: "{{.IMAGE_FULLY_QUALIFIED_reporting}}"
              services.risk-compliance.image: "{{.IMAGE_FULLY_QUALIFIED_risk_compliance}}"
              services.seat-assignment.image: "{{.IMAGE_FULLY_QUALIFIED_seat_assignment}}"
              services.service-plan.image: "{{.IMAGE_FULLY_QUALIFIED_service_plan}}"
              services.supplier-catalog.image: "{{.IMAGE_FULLY_QUALIFIED_supplier_catalog}}"
              services.transfer-management.image: "{{.IMAGE_FULLY_QUALIFIED_transfer_management}}"
