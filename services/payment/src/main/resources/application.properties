# Settings for this service. A release may override any of them through the
# environment: payment.channel.alipay.max-amount-minor is
# PAYMENT_CHANNEL_ALIPAY_MAX_AMOUNT_MINOR, and every other name below follows
# the same rule.

# How often the expiry sweep looks for payment intents that have come due.
payment.timeout-sweeper-delay-ms=1000

# The conservation gauge reads every captured amount and every settled refund
# from the durable snapshots, so it is a money level rather than a latency
# signal and does not need the request path's resolution.
payment.conservation-initial-delay-ms=120000
payment.conservation-refresh-ms=600000

# The channel table the router routes with. Only channels payment-channel can
# settle belong here: ALIPAY, WECHAT_PAY and UNIONPAY settle as ALIPAY_SIM,
# WECHAT_SIM and UNIONPAY_SIM. max-amount-minor is the channel's own ceiling in
# minor units, timeout-seconds is the window a captured intent collects in, and
# weight is the channel's share of the fallback draw.
payment.channel.alipay.channel-id=ALIPAY
payment.channel.alipay.channel-type=ALIPAY
payment.channel.alipay.max-amount-minor=500000
payment.channel.alipay.timeout-seconds=30
payment.channel.alipay.enabled=true
payment.channel.alipay.weight=45

payment.channel.wechat-pay.channel-id=WECHAT_PAY
payment.channel.wechat-pay.channel-type=WECHAT_PAY
payment.channel.wechat-pay.max-amount-minor=200000
payment.channel.wechat-pay.timeout-seconds=30
payment.channel.wechat-pay.enabled=true
payment.channel.wechat-pay.weight=40

payment.channel.unionpay.channel-id=UNIONPAY
payment.channel.unionpay.channel-type=UNIONPAY
payment.channel.unionpay.max-amount-minor=1000000
payment.channel.unionpay.timeout-seconds=60
payment.channel.unionpay.enabled=true
payment.channel.unionpay.weight=15
