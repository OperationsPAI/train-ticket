[project]
name = "corporate-travel"
version = "0.1.0"
description = "Corporate Travel service foundation"
requires-python = ">=3.11"
dependencies = [
  "train-ticket-platform",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The onboarding terms are data the create path reads rather than code, so the
# file has to be named here: the image installs the package, and a wheel that
# carried only the modules would leave the service on its built-in defaults.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corporate_travel = ["config/*.json"]

[tool.uv.sources]
train-ticket-platform = { path = "../../platform/python-kit", editable = true }
