# The HTTP model the deployed service runs: requests park on a virtual thread
# while the store and the outbox are written.
spring.threads.virtual.enabled=true

# The earliest birth date a profile can carry, in ISO-8601 form. The create path
# used to invent 1970-01-01 for a traveler who claimed none, so the platform's
# own epoch is the first date a claim can be on or after, and anything earlier
# is the placeholder coming back rather than a fact the caller holds.
traveler-profile.birth-date.earliest-claim=1970-01-01
