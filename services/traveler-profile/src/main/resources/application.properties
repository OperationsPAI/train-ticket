# The HTTP model the deployed service runs: requests park on a virtual thread
# while the store and the outbox are written.
spring.threads.virtual.enabled=true

# The window of claimed ages the register carries, in years before today. The
# ends are the fare catalogue's own: the youngest band it prices, and the oldest
# one, past which the assisted-travel desk takes the booking. A claim outside
# them is refused on the create path rather than stored for the next service to
# meet at the first quote. They are stated here so a release can move the window
# without a new image.
traveler-profile.claim.min-age-years=6
traveler-profile.claim.max-age-years=65
