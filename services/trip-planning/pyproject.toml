[project]
name = "trip-planning"
version = "0.1.0"
description = "Trip Planning search foundation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
train-ticket-platform = { path = "../../platform/python-kit" }
