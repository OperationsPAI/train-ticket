[project]
name = "trip-planning"
version = "0.1.0"
description = "Trip Planning search foundation"
requires-python = ">=3.11"
dependencies = [
  "train-ticket-platform @ file:///workspace/tasks/REQ-057-python-platform-kit---extract-shared-HTTP/messaging-infrastructure/platform/python-kit",
  "fastapi==0.138.1",
  "redis>=5.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
