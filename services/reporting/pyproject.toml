[project]
name = "reporting"
version = "0.1.0"
description = "Reporting service skeleton"
requires-python = ">=3.11"
dependencies = [
  "train-ticket-platform",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The release catalog ships inside the package it is read from, so the image
# carries the same document a checkout does.
[tool.setuptools.package-data]
reporting = ["config/*.json"]

[tool.uv.sources]
train-ticket-platform = { path = "../../platform/python-kit", editable = true }
