# Settings this release states for boarding facts.
#
# The register is the station estate the release operates: STATION is the agent
# the station hands a boarding through, and PROVIDER is the feed the operator's
# attendant writes. The gate readers were folded into the station agent with
# the rest of the station hardware, so their vocabulary is no longer deployed.
#
# A source may only be trusted while it is deployed: the register is what the
# service answers a boarding under, and a fact that arrives under a vocabulary
# the release does not run is evidence the service cannot place.
boarding.trustedSources=STATION,PROVIDER
# It is read once, when the process starts, so a value that moves travels with
# the release that states it.
