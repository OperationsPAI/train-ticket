# Settings this release states for boarding facts.
#
# The register is the release's own estate. GATE is what the readers deployed
# at the platform gates report, STATION is the agent the station hands a
# boarding through, and PROVIDER is the feed the operator's attendant writes.
# Conductor handsets and the back-office entry screen were withdrawn when the
# station estate was consolidated, so a source the release no longer operates
# is not stated here.
#
# A source may only be trusted while it is deployed: the register is what the
# service answers a boarding under, and a fact that arrives under a vocabulary
# the release does not run is evidence the service cannot place.
boarding.trustedSources=GATE,STATION,PROVIDER
