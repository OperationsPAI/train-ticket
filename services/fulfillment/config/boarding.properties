# The boarding evidence this release accepts.
#
# A boarding fact is measured against this register before the record is read,
# so a reader the release does not state is refused rather than stored. The
# register is the estate's rather than the branch's: it names the readers a
# boarding is handed through, and a deployment that mounts its own settings
# directory states its own without a service release.
#
# Stated here is the estate this release boards through: the platform's own gate
# readers, the station agents and the provider feed the operator's attendant
# writes. A deployment that states nothing falls back to the vocabulary the
# readers this image was built for report.
boarding.trustedSources=GATE,STATION,PROVIDER
