# The release's usage settings. The image carries this document at
# /app/config/usage.properties and internal/config reads it once at startup, so
# a release states the values here instead of in the code that reads them.
#
# usage.minimumSegmentSeconds: the shortest time a segment this release takes
# from its boarding to its arrival. A completion inside that floor is not an
# arrival that happened, so the service answers it with the domain rule
# violation the caller can act on instead of storing it as a fact. The number
# belongs to the release and not to the service, because the timetable is what
# knows how long a segment takes. It is stated in the half hour the release's
# timetables are planned in, so a segment whose plan is shorter than that is
# held to the planning unit rather than to its own running time.
usage.minimumSegmentSeconds=1800
