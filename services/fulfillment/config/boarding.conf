# The readers this release boards through.
#
# A boarding fact is measured against the register stated here before the record
# is read, so a reader this release does not state is refused rather than
# stored. Which readers an estate reports a boarding through is a deployment's
# decision: a deployment that mounts its own settings directory states its own
# without a service release, and a deployment that states none is answered with
# the vocabulary the readers this image was built for report.
#
# Stated here is the estate this release boards through: the station lane's
# handset and the provider feed the operator's attendant writes. The airport
# estate's gate readers are served by that estate's own deployment, so a reader
# this process does not run is not stated here.
boarding.readers=STATION,PROVIDER
