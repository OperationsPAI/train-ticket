# Redis event bus configuration
# REDIS_URL defaults to redis://localhost:6379 when not provided.
# Production runtime wires Redis Streams by default; in-memory messaging is used only by tests.

# Subscriber consumer naming
booking-orchestration.subscriber.consumer-name=${HOSTNAME:booking-orchestration-local}

# How long each planned saga step waits for the answer it was planned around. A step still pending
# when its wait is past is failed by the timeout sweeper and its compensation runs, so these are the
# whole of the time the orchestrator gives the rest of the platform to answer a step. The budgets
# were constants in BookingOrchestrationService.startSagaAggregate (two minutes for the risk check,
# five for each reserve step, two for the invoice) and the defaults here are unchanged.
booking-orchestration.step-wait.risk-check-seconds=${BOOKING_STEP_WAIT_RISK_CHECK_SECONDS:120}
booking-orchestration.step-wait.reservation-seconds=${BOOKING_STEP_WAIT_RESERVATION_SECONDS:300}
booking-orchestration.step-wait.invoice-seconds=${BOOKING_STEP_WAIT_INVOICE_SECONDS:120}
