# Read-path settings for finance-settlement.
#
# One entry per read: how much of it this process takes in one answer. The
# release mounts the file at /app/config/read-paths.properties and the service
# reads it once, before anything serves; FINANCE_SETTLEMENT_SETTINGS names
# another path. Every entry carries its compiled default, so an environment that
# mounts no file serves what the contracts describe, and a checkout runs the
# same values the image does.
#
# The file is read once and never again: nothing on a request path touches the
# disk, so a read is answered against the values the process started with, and a
# value changed under a running process is not what it serves.

# A listing answer carries at most this many entries: the page a caller asks for
# is answered up to it and refused past it. Ten is the share of the read replica
# the operations window measured for these reads; a wider page spends the
# replica's time on rows the operations console does not display.
read.listing.pageBound = 10

# Pages of the platform's settled refunds the daily reconciliation walks before
# it stops and says the platform side is incomplete. 800 pages of 1000 is more
# refunds than any day measured in the operations window settled, and a run that
# reaches the bound still reports what it did not read rather than counting it as
# never settled.
read.platformRefund.pageBound = 800

# Pages of one channel statement the reconciliation walks. 2000 pages of 500
# lines is a million lines, past the largest statement this environment has
# measured (342648), and a bound rather than a target.
read.channelStatement.pageBound = 2000
