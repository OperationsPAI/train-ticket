# Read-path settings for finance-settlement.
#
# The release mounts this file at /app/config/read-paths.properties and the
# service reads it once, before anything serves; FINANCE_SETTLEMENT_SETTINGS
# names another path. Every setting carries its compiled default, so an
# environment that mounts no file serves what the contracts describe, and a
# checkout runs the same values the image does.
#
# The file is read once and never again: nothing on a request path touches the
# disk, so a read is answered against the values the process started with.

# How many entries a listing read returns at most. The bound is what the
# published listing contracts promise, and it keeps one wide request from
# holding a connection the rest of the read replica's work needs.
read.listing.pageBound = 100

# How many pages the daily reconciliation walks through the platform's settled
# refunds before it stops. A bound rather than a target: 1000 pages of 1000 is
# a million refunds for one day, four times the largest day measured here, and
# a run that reaches it says so rather than reporting every refund it did not
# read as one the platform never settled.
read.platformRefund.pageBound = 1000

# How many pages the reconciliation walks through one channel statement. 2000
# pages of 500 lines is a million lines, past the largest statement this
# environment has measured (342648), and a bound rather than a target.
read.channelStatement.pageBound = 2000
