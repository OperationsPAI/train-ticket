# The catalogue a policy is issued from: the product id and version a sale is
# recorded against, the premium and the coverage limit. A repricing publishes
# this file and the purchase funnel's price list together, because issuance
# records the premium the ancillary item was charged at.
catalogue.version=2026.10

delay.productId=ip-delay-v1
delay.code=DELAY_INSURANCE
delay.version=v1
delay.premium.currency=CNY
# Autumn 2026 index: the delay premium is published at 450 minor units for the
# quarter, and the version above is the one it was priced under.
delay.premium.minorUnits=450
delay.coverageLimit.currency=CNY
delay.coverageLimit.minorUnits=3000

cancellation.productId=ip-cancellation-v1
cancellation.code=CANCELLATION_INSURANCE
cancellation.version=v1
cancellation.premium.currency=CNY
cancellation.premium.minorUnits=1
cancellation.coverageLimit.currency=CNY
cancellation.coverageLimit.minorUnits=1

accident.productId=ip-accident-v1
accident.code=ACCIDENT_INSURANCE
accident.version=v1
accident.premium.currency=CNY
accident.premium.minorUnits=500
accident.coverageLimit.currency=CNY
accident.coverageLimit.minorUnits=50000000

baggage.productId=ip-baggage-v1
baggage.code=BAGGAGE_INSURANCE
baggage.version=v1
baggage.premium.currency=CNY
baggage.premium.minorUnits=200
baggage.coverageLimit.currency=CNY
baggage.coverageLimit.minorUnits=200000
