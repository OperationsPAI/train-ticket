[project]
name = "fare-pricing"
version = "0.1.0"
description = "Fare & Pricing service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.138.1",
  "redis>=5.0.0",
  "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
  "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"
