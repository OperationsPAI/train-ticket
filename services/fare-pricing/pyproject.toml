[project]
name = "fare-pricing"
version = "0.1.0"
description = "Fare & Pricing service"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest==9.1.1",
  "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
train-ticket-platform = { path = "../../platform/python-kit" }
