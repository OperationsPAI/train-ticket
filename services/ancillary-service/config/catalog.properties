# Catalogue intake policy, read by src/catalog-policy.ts once at start-up.
#
# A catalogue item states how long before departure its own sales close, and the
# partner desk that confirms an item with the supplier behind it is not the desk
# that issues a voucher here, so the notice it needs is stated for the release
# rather than assumed by every caller. `catalog.notice.floor.methods` names the
# fulfillment methods held to `catalog.notice.floor.hours`; a method that is not
# named is recorded with the cutoff it declares and nothing else, so the floor
# can be carried by a release before the desk behind it is ready for it.
catalog.notice.floor.hours=2
catalog.notice.floor.methods=PROVIDER_CONFIRMATION
