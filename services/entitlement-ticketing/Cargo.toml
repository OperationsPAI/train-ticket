[package]
name = "entitlement-ticketing"
version = "0.1.0"
edition = "2024"

[lib]
name = "entitlement_ticketing"
path = "src/lib.rs"

[dependencies]
opentelemetry = "0.32.0"
axum = "0.8.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shared-kernel = { path = "../../platform/shared-kernel-rust" }
rust-kit = { path = "../../platform/rust-kit", features = ["redis-impl", "reqwest-client"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1.0", features = ["v7", "fast-rng"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# In-memory span exporter for the outbound trace-propagation test.
opentelemetry_sdk = { version = "0.32.0", features = ["testing"] }
