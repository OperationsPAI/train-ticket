[project]
name = "risk-compliance"
version = "0.1.0"
description = "Risk & Compliance service skeleton"
requires-python = ">=3.11"
dependencies = [
  "train-ticket-platform @ file:///workspace/tasks/REQ-057-python-platform-kit---extract-shared-HTTP/messaging-infrastructure/platform/python-kit",
  "fastapi==0.138.1",
  "redis==5.2.1",
]

[dependency-groups]
