project:
  name: train-ticket-ddd-greenfield
  languages: [java, golang, python, rust, typescript]

# Current framing: this repository is being prepared for a full rewrite /
# greenfield rebuild. REQ-001 through REQ-012 describe the current skeleton,
# devcontainer, and regenerated implementation slices. REQ-015 and REQ-016 describe
# the Provider Integration ACL foundation and the current OpenTelemetry collection
# baseline. REQ-011, REQ-013, and REQ-014
# require status reconciliation before they become authoritative active slices.
# REQ-101 through REQ-123 are retained as legacy WP-derived references for
# traceability; they are not the current execution backlog unless explicitly
# regenerated and re-approved. Legacy WP IDs in runtime profiles are
# traceability-only metadata. See docs/00-current-status.md.
requirements:
  - id: REQ-001
    title: "Polyglot bounded-context skeleton"
    description: "Initialize one service skeleton per DDD bounded context and one platform shared-kernel module."
    priority: P0
    status: tested
    code:
      - path: service-catalog.json
        description: "Machine-readable service ownership and language catalog."
      - path: services
        description: "Bounded-context service skeletons."
      - path: platform/shared-kernel-rust
        description: "Shared Kernel reference skeleton."
    tests:
      - path: scripts/check-skeleton.py
        description: "Validates catalog, service files, and bootstrapped language checks."
    docs:
