      - path: .devcontainer/scripts/check.sh
        description: "Reports available toolchain versions and validates the repository layout."
      - path: .dockerignore
        description: "Keeps local caches, AgentM artifacts, and build outputs out of Docker build contexts."
      - path: Makefile
        description: "Provides host entry points for devcontainer checks and AgentM/ARL worker image builds."
    tests:
      - path: .devcontainer/scripts/check.sh
        description: "Smoke check for documentation and toolchain availability."
      - path: Makefile
