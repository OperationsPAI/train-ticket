name: train-ticket-observability

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.112.0}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
      - "${OTEL_ZPAGES_PORT:-55679}:55679"
    depends_on:
      clickhouse:
        # Not service_started: the exporter creates its schema on first write,
        # and a collector that comes up before the server accepts connections
        # spends its retry budget before doing anything useful.
        condition: service_healthy
    restart: unless-stopped

  # Durable store for traces, logs and metrics. Mirrors the StatefulSet in
  # deploy/helm/train-ticket/templates/clickhouse.yaml -- including TZ=UTC,
  # without which the server reinterprets UTC query literals as local time and
  # silently returns no rows for a window that does contain data.
  #
  # Only the OTLP pipeline exists here; the pod-log and kubelet receivers that
  # the kind deployment runs (otel-agent, otel-cluster) have no meaning outside
  # a cluster.
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trainticket-otel}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-otel}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # ClickHouse wants far more open files than the Docker default 1024.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

volumes:
  clickhouse-data:
    name: ${CLICKHOUSE_VOLUME:-train-ticket-clickhouse-data}
