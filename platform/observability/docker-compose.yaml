name: train-ticket-observability

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
      - "${OTEL_ZPAGES_PORT:-55679}:55679"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  # One-shot: a fresh named volume is created root:root 0755, but the jaeger
  # image runs as uid 10001 / gid 0 and needs to create its Badger directories.
  # This is the compose equivalent of the pod securityContext.fsGroup used in
  # deploy/k8s/jaeger.yaml. It reuses the jaeger image so no extra image is pulled.
  jaeger-init:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.57}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /badger/keys /badger/values && chown -R 10001:0 /badger && chmod -R g+rwX /badger
    volumes:
      - jaeger-badger:/badger
    restart: "no"

  # Durable trace store. Mirrors deploy/k8s/jaeger.yaml: Badger on a persistent
  # volume with an explicit 12h retention window. See docs/07-observability/README.md
  # for the capacity arithmetic behind JAEGER_SPAN_STORE_TTL.
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.57}
    command:
      - --badger.ephemeral=false
      - --badger.directory-key=/badger/keys
      - --badger.directory-value=/badger/values
      - --badger.span-store-ttl=${JAEGER_SPAN_STORE_TTL:-12h}
      - --badger.maintenance-interval=5m
    environment:
      SPAN_STORAGE_TYPE: badger
      COLLECTOR_OTLP_ENABLED: "true"
      GOMEMLIMIT: 1750MiB
    volumes:
      - jaeger-badger:/badger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  jaeger-badger:
    name: ${JAEGER_BADGER_VOLUME:-train-ticket-jaeger-badger}
