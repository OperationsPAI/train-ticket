name: train-ticket-observability

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
      - "${OTEL_ZPAGES_PORT:-55679}:55679"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.57}
    command:
      - --memory.max-traces=20000
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
