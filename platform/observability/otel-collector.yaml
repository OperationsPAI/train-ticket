# Canonical OTLP-gateway collector config for local compose and the kind
# deployment. Keep the otel-collector-config ConfigMap data in
# deploy/helm/train-ticket/templates/observability.yaml synchronized with this
# file until the chart can consume this file directly as its single source.
#
# This is the GATEWAY only -- the receivers that read node-local or
# cluster-scoped state (filelog, kubeletstats, hostmetrics, k8s_cluster,
# k8sobjects, prometheus) live in the otel-agent and otel-cluster collectors,
# which have no meaning outside a cluster and so have no compose equivalent.
# See deploy/helm/train-ticket/templates/otel-agent.yaml and otel-cluster.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  forward/prometheus_application: {}

processors:
  memory_limiter:
    check_interval: 5s
    # Kept in sync with otelCollector.memoryLimitMiB in
    # deploy/helm/train-ticket/values.yaml, whose Deployment sets a 1Gi
    # container limit. Must stay above the sending_queue below: a limiter
    # smaller than the queue makes the collector refuse spans it could buffer.
    limit_mib: 768
  # The local baseline mirrors the cluster gateway: ClickHouse receives the
  # complete OTLP metric signal, while the Prometheus endpoint below publishes
  # only bounded runtime families and the train_ticket.* business contract.
  filter/prometheus_application:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^(http[.](server[.](request[.]duration|active_requests)|client[.]request[.]duration)|db[.]client[.]connection[.].+|hikaricp[.]connections([.].*)?|jvm[.](memory[.].+|gc[.]pause|threads[.]live)|go[.].+|process[.].+|cpython[.]gc[.].+|v8js[.].+|nodejs[.].+|train_ticket[.].+)$")'
        - 'resource.attributes["service.name"] == nil'
  transform/prometheus_application:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'keep_keys(attributes, ["service.name", "service.namespace", "service.instance.id"])'
      - context: datapoint
        statements:
          - 'set(attributes["service"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil'
          - 'set(attributes["namespace"], resource.attributes["service.namespace"]) where resource.attributes["service.namespace"] != nil'
          - 'set(attributes["http.request.method"], attributes["http.method"]) where attributes["http.request.method"] == nil and attributes["http.method"] != nil'
          - 'set(attributes["http.response.status_code"], attributes["http.status_code"]) where attributes["http.response.status_code"] == nil and attributes["http.status_code"] != nil'
          - 'set(attributes["reason_code"], attributes["failure.type"]) where attributes["reason_code"] == nil and attributes["failure.type"] != nil'
          - 'set(attributes["reason_code"], attributes["reason"]) where attributes["reason_code"] == nil and attributes["reason"] != nil'
          - 'keep_keys(attributes, ["service", "namespace", "http.route", "http.request.method", "http.response.status_code", "network.protocol.version", "url.scheme", "db.client.connection.pool.name", "db.client.connection.state", "pool", "jvm.memory.pool.name", "jvm.memory.type", "jvm.gc.name", "jvm.gc.action", "jvm.gc.cause", "go.memory.type", "go.gc.type", "v8js.heap.space.name", "v8js.gc.type", "nodejs.eventloop.state", "workflow", "stage", "state", "action", "outcome", "reason_code", "currency", "channel", "operation", "travel_class", "seat_mode", "ticket_type", "queue", "event_stream", "consumer_group", "event_type", "signal_type", "source", "source_service", "target_service"])'
  batch/prometheus_application:
    timeout: 2s
    send_batch_size: 1024
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  # Durable store for all three signals. In the cluster this is the ClickHouse
  # StatefulSet; under compose it is the `clickhouse` service in
  # docker-compose.yaml.
  #
  # Note the k8sattributes processor the in-cluster config runs is absent here:
  # there is no Kubernetes API to enrich against, so signals carry only what the
  # SDK set. The database, tables and TTL are otherwise identical, so a query
  # written against one works against the other.
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4&username=${env:CLICKHOUSE_USER}&password=${env:CLICKHOUSE_PASSWORD}
    # NOT `default`: every query names this database explicitly.
    database: otel
    # The exporter issues CREATE TABLE IF NOT EXISTS for each signal on startup,
    # plus the otel_traces_trace_id_ts materialized view. Nothing else creates
    # telemetry tables.
    create_schema: true
    # Applied as a TTL clause at CREATE time only -- changing this does not
    # retro-fit a TTL onto tables that already exist.
    ttl: 72h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    # A prefix: the exporter derives otel_metrics_gauge, _sum, _histogram,
    # _exponential_histogram and _summary from it.
    metrics_table_name: otel_metrics
    timeout: 10s
    # The store is a stateful, restartable component holding an exclusive lock on
    # its volume, so a restart takes it offline for a few seconds. Retry plus a
    # bounded queue means signals emitted in that window are redelivered rather
    # than dropped. The queue is in memory, so this covers a STORE restart, not a
    # collector restart.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4000
  prometheus/application:
    endpoint: 0.0.0.0:9464
    metric_expiration: 2m
    enable_open_metrics: true
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    logs:
      level: info
    metrics:
      # Must be set explicitly. This collector version defaults the telemetry
      # endpoint to localhost:8888, which is only reachable from inside the
      # container -- so the collector's own metrics (otelcol_receiver_*,
      # otelcol_exporter_*) cannot be scraped, and those counters are the way to
      # tell "no traffic" apart from "signals are being dropped".
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions:
    - health_check
    - zpages
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
    metrics/prometheus_application:
      receivers:
        - forward/prometheus_application
      processors:
        - memory_limiter
        - filter/prometheus_application
        - transform/prometheus_application
        - batch/prometheus_application
      exporters:
        - prometheus/application
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
        - forward/prometheus_application
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - clickhouse
