# Canonical collector config for local compose and the kind deployment.
# Keep the otel-collector-config ConfigMap data in
# deploy/helm/train-ticket/templates/observability.yaml synchronized with this
# file until the chart can consume this file directly as its single source.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    # Kept in sync with otelCollector.memoryLimitMiB in
    # deploy/helm/train-ticket/values.yaml, whose Deployment sets a 1Gi
    # container limit. Must stay above the sending_queue below: a limiter
    # smaller than the queue makes the collector refuse spans it could buffer.
    limit_mib: 768
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    # The trace store is now a stateful, restartable component: it holds an
    # exclusive lock on its Badger volume, so a restart takes it offline for a
    # few seconds. Retry plus a bounded queue means spans emitted during that
    # window are redelivered instead of dropped on the floor.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 4000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    logs:
      level: info
  extensions:
    - health_check
    - zpages
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
        - otlp/jaeger
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
