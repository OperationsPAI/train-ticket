[package]
name = "rust-kit"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_kit"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shared-kernel = { path = "../shared-kernel-rust" }
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"], optional = true }
uuid = { version = "1.0", features = ["v4", "v7", "fast-rng"] }

[features]
default = []
redis-impl = ["redis", "tokio"]

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
