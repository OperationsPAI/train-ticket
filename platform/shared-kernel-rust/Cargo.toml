[package]
name = "shared-kernel"
version = "0.1.0"
edition = "2024"

[lib]
name = "shared_kernel"
path = "src/lib.rs"

[dependencies]
opentelemetry = "0.32.0"
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
